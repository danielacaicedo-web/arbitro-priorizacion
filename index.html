/* ---------- Acta: versión completa y exportable ---------- */
function actaTexto(e){
  const L=[];let n=0;const S_=t=>{n++;L.push("## "+n+". "+t);};
  L.push("# Acta de evaluación — "+(e.iniciativa||"Iniciativa"));
  L.push("");
  L.push("- Squad: "+(e.squad||"sin declarar"));
  L.push("- Responsable: "+(e.autor||"sin declarar"));
  L.push("- Fecha: "+e.fecha+" · Versión "+(e.version||1));
  L.push("- Estado del expediente: "+(e.ciclo||"Borrador"));
  if(e.decision)L.push("- Decisión de la mesa: "+e.decision);
  L.push("");
  S_("Veredicto");
  if(typeof e.puntaje==="number"){
    const n=nivelDe(e.puntaje);
    L.push("Calificación de sustentación: "+e.puntaje+" de 100 — "+n.t+".");
    L.push(n.d);
    const r=riceDe(e.prioridad);
    if(r){L.push("Prioridad estimada (RICE): "+r.indice+" de 100 — "+bandaPrioridad(r).t+".");
      L.push("Alcance "+e.prioridad.alcance+"% de usuarios · Impacto "+e.prioridad.impacto+" · Confianza "+e.prioridad.confianza.valor+"% · Esfuerzo "+e.prioridad.esfuerzo);
      L.push("Cuadrante: "+cuadranteDe(e.puntaje,r).t+". "+cuadranteDe(e.puntaje,r).d);}
    else L.push("Prioridad estimada: no calculable. Falta "+faltaRice(e.prioridad).join(" y ")+".");
  }else L.push((SEM[e.semaforo]||{t:""}).t+". "+(e.lectura||""));
  L.push("Este resultado mide qué tan sólida está la sustentación, no qué tan prioritaria es la iniciativa.");
  L.push("");
  S_("Qué trae el documento");
  L.push("Lo que un PRD de Spin tiene que traer:");
  (e.admisibilidad||[]).filter(a=>(a.nivel||"esencial")==="esencial").forEach(a=>L.push("- "+a.elemento+": "+a.estado));
  L.push("");
  L.push("Lo que subiría el estándar (no baja el veredicto):");
  (e.admisibilidad||[]).filter(a=>a.nivel==="mejora").forEach(a=>L.push("- "+a.elemento+": "+a.estado));
  L.push("");
  S_("Evaluación criterio por criterio");
  (e.criterios||[]).forEach(c=>{
    L.push("### "+c.nombre+" — "+c.estado);
    L.push(c.nota);
    if(c.cita)L.push("> \""+c.cita+"\"");
    const v=(e.votos||{})[c.id];
    if(v)L.push(v.v==="ok"?"El PM está de acuerdo con esta lectura.":"El PM no está de acuerdo: "+v.motivo);
    L.push("");
  });
  if((e.cambios||[]).length){
    S_("Qué pasó con tus respuestas");
    e.cambios.forEach(c=>L.push("- "+c.criterio+": "+(c.de===c.a?"sigue en "+c.a:"de "+c.de+" a "+c.a)+". "+c.porque));
    L.push("");
  }
  S_("Preguntas y respuestas");
  (e.preguntas||[]).forEach(p=>{
    L.push("**"+p.texto+"**");
    L.push(p.nolose?"El PM declaró que no lo sabe.":(p.respuesta.trim()||"Sin responder."));
    L.push("");
  });
  S_("Cruces con otros squads");
  if((e.dependencias||[]).length)e.dependencias.forEach(d=>L.push("- "+d.tipo+" con "+d.iniciativa+" ("+d.squad+"): "+d.nota));
  else L.push("Ninguno dentro de las iniciativas cargadas.");
  if(e.cobertura)L.push("Límite de esta revisión: "+e.cobertura);
  L.push("");
  S_("Qué falta antes de la mesa");
  const f=(e.criterios||[]).filter(c=>c.estado!=="sustentado");
  if(f.length)f.forEach(c=>L.push("- "+c.nombre+": "+c.nota));
  else L.push("Nada pendiente.");
  const ab=(e.preguntas||[]).filter(p=>p.nolose||!p.respuesta.trim());
  if(ab.length){L.push("");L.push("Preguntas que siguen abiertas:");ab.forEach(p=>L.push("- "+p.texto));}
  if((e.hilo||[]).filter(m=>m.rol==="pm").length){
    L.push("");S_("Lo que el PM preguntó durante la evaluación");
    e.hilo.filter(m=>m.rol==="pm").forEach(m=>L.push("- "+m.texto));
  }
  L.push("");
  L.push("---");
  L.push("Generado por el Árbitro de priorización de Spin. La evaluación se apoya solo en el texto entregado y en las iniciativas cargadas en la herramienta.");
  return L.join("\n");
}
function copiarActa(){
  const t=actaTexto(S.exp);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>set({aviso:"Acta copiada. Pégala donde la necesites."}),
      ()=>set({aviso:"No pude copiar. Descárgala en su lugar."}));
  }else set({aviso:"No pude copiar el acta. Descárgala y la tienes igual."});
}
function descargarActa(){
  const b=new Blob([actaTexto(S.exp)],{type:"text/markdown"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download=(S.exp.nombre||"acta").replace(/[^\w\-]+/g,"_")+".md";a.click();
}
function imprimirActa(){
  const z=$("#areaImpresion");
  z.innerHTML=`<h1 style="font-family:var(--display)">Acta de evaluación</h1>
    <p><strong>${esc(S.exp.iniciativa||"")}</strong><br>${esc(S.exp.squad||"")} · ${esc(S.exp.fecha||"")} · versión ${S.exp.version||1}${S.exp.autor?" · "+esc(S.exp.autor):""}</p>`
    +actaTexto(S.exp).split("\n").slice(7).map(l=>{
      if(l.startsWith("### "))return "<h3>"+esc(l.slice(4))+"</h3>";
      if(l.startsWith("## "))return "<h2>"+esc(l.slice(3))+"</h2>";
      if(l.startsWith("> "))return '<blockquote style="border-left:3px solid #C7A1FF;padding-left:10px;font-style:italic">'+esc(l.slice(2))+"</blockquote>";
      if(l.startsWith("- "))return "<div style='margin-left:14px'>• "+esc(l.slice(2))+"</div>";
      if(l.startsWith("**"))return "<p><strong>"+esc(l.replace(/\*\*/g,""))+"</strong></p>";
      if(l==="---")return "<hr>";
      return l?"<p>"+esc(l)+"</p>":"";
    }).join("");
  window.print();
}

/* ============================================================ ACCIONES */
let _pantalla="";
function render(){
  try{
  const clave=S.vista+"|"+(S.exp?(S.exp.paso||"")+"|"+S.exp.id:"")+"|"+(S.viendo?S.viendo.id:"");
  if(clave!==_pantalla){_pantalla=clave;requestAnimationFrame(()=>window.scrollTo({top:0,behavior:"auto"}));}
  $("#nav-inicio").className=S.vista==="inicio"?"on":"";
  $("#nav-ini").className=S.vista==="ini"?"on":"";
  $("#nav-exp").className=S.vista==="exp"?"on":"";
  const av=S.aviso?`<div class="aviso">${esc(S.aviso)}</div>`:"";
  $("#main").innerHTML=av+(S.vista==="inicio"?vInicio():S.vista==="chat"?vChat():S.vista==="ini"?vIniciativas():S.vista==="ver"?vVer():vExp());
  if(S.vista==="inicio"){armarDrop();if(/avanzado/.test(location.search)){const a=$("#avanzado");if(a)a.style.display="block";}}
  }catch(err){console.error(err);$("#main").innerHTML='<div class="aviso">Algo se rompió al dibujar la pantalla. Recarga el archivo y vuelve a intentarlo.</div>';}
}

function pintarProgreso(){
  const e=S.exp,r=e.preguntas.filter(p=>p.nolose||p.respuesta.trim()).length,t=e.preguntas.length;
  const p=document.querySelector(".progreso"),b=document.querySelector(".barraP i"),
        btn=[...document.querySelectorAll(".btn")].find(x=>x.textContent.includes("Revisar con mis"));
  if(p)p.textContent=r+" de "+t+" respondidas";
  if(b)b.style.width=(t?r/t*100:0)+"%";
  if(btn)btn.disabled=r!==t;
}
function verEjemplo(id){S.exp.ejemplos=S.exp.ejemplos||{};S.exp.ejemplos[id]=!S.exp.ejemplos[id];sincronizar();render();}
function preguntarEso(t){const i=$("#qbox");if(i){i.value=t;}preguntar();}
async function preguntar(){
  const i=$("#qbox");if(!i)return;
  const t=(i.value||"").trim();if(!t)return;
  S.exp.hilo=S.exp.hilo||[];
  S.exp.hilo.push({rol:"pm",texto:t});
  i.value="";
  let r=null;
  if(S.key.trim()){
    try{
      const d=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":S.key.trim(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:400,
          system:SYSTEM+" Ahora el PM te está preguntando algo sobre tu evaluación. Responde en dos o tres frases, en español llano, sin JSON. No escribas el PRD por él.",
          messages:[{role:"user",content:"EVALUACIÓN:\n"+JSON.stringify(S.exp.criterios)+"\n\nPREGUNTA DEL PM: "+t}]})});
      if(d.ok){const j=await d.json();r=j.content.filter(b=>b.type==="text").map(b=>b.text).join("").trim();}
    }catch(e){}
  }
  S.exp.hilo.push({rol:"agente",texto:r||responderLocal(t,S.exp)});
  sincronizar();render();
  setTimeout(()=>{const q=$("#qbox");if(q)q.focus();},50);
}
function fijarEstado(id,v){const e=S.expedientes.find(x=>x.id===id);if(e){e.ciclo=v;if(v==="Borrador")e.decision="";}persistir();render();}
function fijarDecision(id,v){const e=S.expedientes.find(x=>x.id===id);if(e)e.decision=v;persistir();}
function nolose(i){const p=S.exp.preguntas[i];p.nolose=!p.nolose;if(p.nolose)p.respuesta="";sincronizar();render();}
function votar(id,v){
  if(v===null){delete S.exp.votos[id];render();return;}
  if(v==="no"){const m=prompt("¿Por qué no estás de acuerdo?");if(!m)return;S.exp.votos[id]={v:"no",motivo:m};}
  else S.exp.votos[id]={v:"ok"};
  sincronizar();render();
}

async function empezar(){
  const t=(S.doc||"").trim();
  if(t.length<110){set({aviso:"Con tan poco no alcanzo a orientarte. Cuéntame al menos qué problema viste, a quién le pasa y qué se te ocurrió hacer."});return;}
  const hoy=new Date().toISOString().slice(0,10);
  const auto=leerMeta(t);
  const meta={iniciativa:S.meta.iniciativa||auto.iniciativa,squad:S.meta.squad||auto.squad,autor:S.meta.autor||auto.autor};
  const ver=versionDe(meta.iniciativa);
  S.exp={id:"x"+Date.now(),prdHtml:S.docHtml||"",nombre:nombreExp(meta,hoy,ver),iniciativa:meta.iniciativa,
    squad:meta.squad,autor:meta.autor,version:ver,fecha:hoy,prd:t,votos:{},cambios:[],
    ejemplos:{},hilo:[],ciclo:"Borrador",cerrado:false};
  S.exp.paso="lectura";S.exp.qi=0;
  S.expedientes.unshift(S.exp);persistir();
  set({vista:"chat",fase:"leyendo",aviso:""});

  let r=null;
  if(S.key.trim()){try{
    const m=await evaluarConModelo(t,S.key.trim());
    const loc=evaluarLocal(t,S.expedientes);
    r={admisibilidad:loc.admisibilidad,minimos:m.minimos_faltantes||[],noEvaluable:!!m.no_evaluable,
       criterios:m.criterios||loc.criterios,dependencias:m.dependencias||loc.dependencias,
       cobertura:m.cobertura||loc.cobertura,
       preguntas:(m.preguntas||[]).map(p=>({...p,respuesta:"",nolose:false}))};
  }catch(err){}}
  if(!r){const loc=evaluarLocal(t,S.expedientes);r={...loc,preguntas:preguntasDe(loc.criterios)};}
  if(!r.preguntas||!r.preguntas.length)r.preguntas=preguntasDe(r.criterios);

  await new Promise(res=>setTimeout(res,1400));
  const sem=semaforoDe(r.criterios,r.noEvaluable);
  Object.assign(S.exp,r,{semaforo:sem,lectura:lecturaDe(r.criterios,sem)});
  S.exp.puntaje=puntajeDe(r.criterios,r.admisibilidad);
  S.exp.prioridad=prioridadDe(t,r.criterios);
  if(ver>1)S.exp.avisos=[...(S.exp.avisos||[]),"Ya tenías “"+meta.iniciativa+"” evaluada. Esta queda como versión "+ver+" y vas a poder comparar las dos."];
  sincronizar();
  set({fase:""});
}

async function revisar(){
  set({fase:"revisando"});
  await new Promise(r=>setTimeout(r,1100));
  const {criterios,cambios}=reevaluarLocal(S.exp);
  const sem=semaforoDe(criterios,false);
  Object.assign(S.exp,{criterios,cambios,semaforo:sem,lectura:lecturaDe(criterios,sem),cerrado:true,paso:"informe"});
  S.exp.puntaje=puntajeDe(criterios,S.exp.admisibilidad);
  S.exp.prioridad=Object.assign(prioridadDe(S.exp.prd+" "+S.exp.preguntas.map(q=>q.respuesta).join(" "),criterios),{impacto:(S.exp.prioridad||{}).impacto||null});
  sincronizar();set({fase:""});
}

function guardar(){
  const i=S.expedientes.findIndex(e=>e.id===S.exp.id);
  if(i>=0)S.expedientes[i]=S.exp;else S.expedientes.unshift(S.exp);
  persistir();ir("exp");
}
function sincronizar(){
  const i=S.expedientes.findIndex(e=>e.id===S.exp.id);
  if(i>=0)S.expedientes[i]=S.exp;persistir();
}
function irPaso(k){S.exp.paso=k;sincronizar();render();}
function marcarPunto(i){
  const P=S.exp.preguntas,hechas=P.filter(q=>q.nolose||q.respuesta.trim()).length,listo=hechas===P.length;
  const b=document.querySelector(".barraP i");if(b)b.style.width=(hechas/P.length*100)+"%";
  const pt=document.querySelectorAll(".puntos .pt")[i];
  if(pt)pt.classList.toggle("ok",!!(P[i].respuesta.trim()||P[i].nolose));
  const av=document.querySelector(".avanzar");
  if(av){
    av.disabled=!listo;
    av.classList.toggle("off",!listo);
    av.onclick=listo?revisar:null;
    const t=av.querySelector("b"),e=av.querySelector("em");
    if(t)t.textContent=listo?"Entregar para calificar":"Te faltan "+(P.length-hechas)+" de "+P.length;
    if(e)e.textContent=listo?"Reviso con tus respuestas y te entrego la calificación y el informe."
                            :"Responde todas, o marca las que no sepas. Ninguna se pierde.";
  }
}
function ordenados(){
  let L=S.expedientes.slice();
  if(S.filtro&&S.filtro!=="todas")L=L.filter(e=>estadoDe(e).clave===S.filtro);
  if(S.orden==="calif")L.sort((a,b)=>(b.puntaje||-1)-(a.puntaje||-1));
  else if(S.orden==="prior")L.sort((a,b)=>{const x=riceDe(a.prioridad),y=riceDe(b.prioridad);return (y?y.indice:-1)-(x?x.indice:-1);});
  return L;
}
function nuevaVersion(id){
  const e=S.expedientes.find(x=>x.id===id);if(!e)return;
  S.doc=e.prd; S.meta={iniciativa:e.iniciativa||"",squad:e.squad||"",autor:e.autor||""};
  set({vista:"inicio",aviso:"Cargué el documento de “"+(e.iniciativa||e.nombre)+"”. Edítalo y vuelve a pasarlo: se guarda como versión "+((e.version||1)+1)+" y podrás compararlas."});
}
function abrir(id){S.exp=S.expedientes.find(e=>e.id===id);if(!S.exp.paso)S.exp.paso=S.exp.cerrado?"informe":"lectura";ir("chat");}
function renombrar(id,v){const e=S.expedientes.find(x=>x.id===id);if(e)e.nombre=v;persistir();}
function bajar(e){
  const b=new Blob([JSON.stringify(e,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download=e.nombre.replace(/[^\w\-]+/g,"_")+".json";a.click();
}
function descargar(){bajar(S.exp);}
function descargarE(id){bajar(S.expedientes.find(e=>e.id===id));}
function importar(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);
    if(!o.nombre||!o.criterios||!o.prd)throw 0;
    o.id="i"+Date.now();S.expedientes.unshift(o);persistir();set({aviso:""});
  }catch(e){set({aviso:"Ese archivo no es un expediente del Árbitro. Tu lista quedó igual."});}};
  r.readAsText(f);
}

/* ---------- Archivos ---------- */
function armarDrop(){
  const d=$("#drop");if(!d)return;
  ["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("over");}));
  d.addEventListener("drop",e=>{if(e.dataTransfer.files[0])leerArchivo(e.dataTransfer.files[0]);});
}
async function leerArchivo(f){
  if(!f)return;
  const est=$("#estadoArchivo");const di=t=>{if(est)est.textContent=t;};
  di("Leyendo "+f.name+"…");
  const n=f.name.toLowerCase();
  try{
    if(n.endsWith(".txt")||n.endsWith(".md")){S.doc=await f.text();S.docHtml="";}
    else if(n.endsWith(".docx")){
      if(!window.mammoth)throw new Error("lib");
      const b=await f.arrayBuffer();
      S.doc=(await mammoth.extractRawText({arrayBuffer:b})).value;
      try{S.docHtml=(await mammoth.convertToHtml({arrayBuffer:b})).value;}catch(e){S.docHtml="";}
    }else if(n.endsWith(".pdf")){
      if(!window.pdfjsLib)throw new Error("lib");
      pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      let t="";for(let i=1;i<=doc.numPages;i++){const p=await doc.getPage(i);
        t+=(await p.getTextContent()).items.map(x=>x.str).join(" ")+"\n\n";}
      S.doc=t;S.docHtml="";
    }else throw new Error("tipo");
    render();
    const e2=$("#estadoArchivo");if(e2)e2.textContent="Listo: "+f.name+" ("+S.doc.trim().length+" caracteres).";
  }catch(err){
    di(err.message==="lib"
      ? "No pude abrir ese archivo ahora. Pega el texto directamente y seguimos."
      : "Ese formato no lo puedo leer. Usa Word, PDF o texto, o pega el contenido.");
  }
}

restaurar();
render();
</script>
