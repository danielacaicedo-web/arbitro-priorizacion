<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Árbitro de priorización — Spin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --morado:#5601D9; --naranja:#FC630E; --lilaSuave:#EEE3FF; 
  --paper:#F6F4FB; --surface:#FFFFFF; --ink:#2D2F3A; --tinta:#210B50;
  --muted:#6B6C7A; --line:#E9E4F5; --verdeSoft:#E6F4EC;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Rethink Sans','Inter',system-ui,sans-serif;
  --r:20px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
header{background:rgba(255,255,255,.88);border-bottom:1px solid var(--line);padding:20px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:30}
.marca{display:flex;align-items:center;gap:11px}
.marca .prod{font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--tinta)}
nav{margin-left:auto;display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:99px}
nav button{background:none;border:none;color:var(--muted);padding:8px 15px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
nav button:hover{color:var(--tinta)}
nav button.on{background:var(--surface);color:var(--morado);box-shadow:0 1px 3px rgba(33,11,80,.1)}
main{max-width:1180px;margin:0 auto;padding:30px 26px 80px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:20px}
.btn{background:var(--morado);color:#fff;border:none;padding:12px 22px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(86,1,217,.2)}
.btn.sec{background:var(--lilaSuave);color:var(--morado)}
h1,h2,h3{font-family:var(--display);color:var(--tinta);margin:0 0 16px}
footer{border-top:1px solid var(--line);padding:20px;text-align:center;font-size:12px;color:var(--muted)}
.sync-status{position:fixed;bottom:20px;right:20px;padding:12px 16px;border-radius:99px;font-size:12px;font-weight:600;background:var(--lilaSuave);color:var(--morado);z-index:100;transition:all .3s}
.sync-status.saved{background:var(--verdeSoft);color:#1E7A4B}
.iniciativa{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.iniciativa .info{flex:1}
.iniciativa .nombre{font-weight:600;color:var(--tinta);margin-bottom:4px}
.iniciativa .squad{font-size:12px;color:var(--muted)}
.iniciativa .btn{padding:6px 12px;font-size:12px;margin-left:10px}
ul{list-style:none;padding:0;margin:0}
</style>
</head>
<body>

<header>
  <div class="marca">
    <div class="prod">📋 Árbitro de priorización</div>
  </div>
  <nav>
    <button id="nav-inicio" class="on" onclick="ir('inicio')">Nueva evaluación</button>
    <button id="nav-ini" onclick="ir('ini')">Iniciativas</button>
  </nav>
</header>

<main id="main"></main>
<div id="sync-status" class="sync-status">✓ Listo</div>
<footer>Árbitro de priorización · Spin</footer>

<script>
let INICIATIVAS = [];
let currentView = 'inicio';

function loadData() {
  try {
    const data = localStorage.getItem('arbitro_iniciativas');
    INICIATIVAS = data ? JSON.parse(data) : [];
  } catch (e) {
    INICIATIVAS = [];
  }
  mostrarVista('inicio');
}

function saveData() {
  localStorage.setItem('arbitro_iniciativas', JSON.stringify(INICIATIVAS));
  showSaved();
}

function showSaved() {
  const status = document.getElementById('sync-status');
  status.textContent = '✓ Guardado';
  status.classList.add('saved');
  setTimeout(() => {
    status.classList.remove('saved');
    status.textContent = '✓ Listo';
  }, 2000);
}

function ir(vista) {
  currentView = vista;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('on'));
  document.getElementById('nav-' + vista).classList.add('on');
  mostrarVista(vista);
}

function mostrarVista(vista) {
  const main = document.getElementById('main');
  
  if (vista === 'inicio') {
    main.innerHTML = `
      <div class="card">
        <h1>Nueva evaluación</h1>
        <p style="margin:0 0 20px; color:var(--muted)">Total de iniciativas: <strong style="color:var(--tinta)">${INICIATIVAS.length}</strong></p>
        <button class="btn" onclick="nuevaIniciativa()">+ Agregar iniciativa</button>
      </div>
      ${INICIATIVAS.length > 0 ? `
        <div class="card">
          <h2>Últimas iniciativas</h2>
          <ul>
            ${INICIATIVAS.slice(-5).reverse().map(i => `
              <li class="iniciativa">
                <div class="info">
                  <div class="nombre">${i.nombre}</div>
                  <div class="squad">${i.squad} · ${i.estado}</div>
                </div>
                <button class="btn sec" onclick="eliminarIniciativa(${i.id})">✕</button>
              </li>
            `).join('')}
          </ul>
        </div>
      ` : ''}
    `;
  } else if (vista === 'ini') {
    const squads = {};
    INICIATIVAS.forEach(init => {
      if (!squads[init.squad]) squads[init.squad] = [];
      squads[init.squad].push(init);
    });
    
    let html = '<div class="card"><h2>Iniciativas por squad</h2>';
    if (INICIATIVAS.length === 0) {
      html += '<p style="color:var(--muted)">No hay iniciativas aún</p>';
    } else {
      for (const squad in squads) {
        html += `<h3 style="margin-top:20px">${squad}</h3><ul>`;
        squads[squad].forEach(init => {
          html += `<li class="iniciativa">
            <div class="info">
              <div class="nombre">${init.nombre}</div>
              <div class="squad">${init.estado}</div>
            </div>
            <button class="btn sec" onclick="eliminarIniciativa(${init.id})">✕</button>
          </li>`;
        });
        html += '</ul>';
      }
    }
    main.innerHTML = html + '</div>';
  }
}

function nuevaIniciativa() {
  const nombre = prompt('Nombre de la iniciativa:');
  if (!nombre) return;
  
  const squad = prompt('Squad:');
  if (!squad) return;
  
  INICIATIVAS.push({
    id: Date.now(),
    nombre: nombre.trim(),
    squad: squad.trim(),
    estado: 'En definición',
    timestamp: new Date().toISOString()
  });
  
  saveData();
  mostrarVista(currentView);
}

function eliminarIniciativa(id) {
  if (confirm('¿Eliminar esta iniciativa?')) {
    INICIATIVAS = INICIATIVAS.filter(i => i.id !== id);
    saveData();
    mostrarVista(currentView);
  }
}

document.addEventListener('DOMContentLoaded', loadData);
</script>

</body>
</html>
document.addEventListener('DOMContentLoaded', initFirebase);
</script>
</body>
</html>
