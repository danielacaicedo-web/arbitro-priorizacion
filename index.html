<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Árbitro de priorización — Spin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
<style>
:root{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
  /* Núcleo de marca Spin */
  --morado:#5601D9; --naranja:#FC630E;
  --moradoOsc:#210B50; --cafe:#542200; --grisOsc:#2D2F3A;
  --lila:#C7A1FF; --naranjaClaro:#FFA366;
  --lilaSuave:#EEE3FF; --duraznoSuave:#FFF0E5; --peri:#D9DBFD;

  /* Roles */
  --paper:#F6F4FB; --surface:#FFFFFF; --ink:#2D2F3A; --tinta:#210B50;
  --muted:#6B6C7A; --faint:#9B9CA9; --line:#E9E4F5;
  --accent:var(--morado); --accentSoft:var(--lilaSuave);
  --verde:#5601D9; --verdeSoft:#EEE3FF;      /* sustentado  */
  --ambar:#C24A00; --ambarSoft:#FFF0E5;      /* falta info  */
  --rojo:#2D2F3A;  --rojoSoft:#D9DBFD;       /* no evaluable*/
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Rethink Sans','Inter',system-ui,sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  --r:20px; --rs:14px;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
*:focus-visible{outline:2px solid var(--morado);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3,.display{font-family:var(--display);letter-spacing:-.025em;color:var(--tinta)}

/* Encabezado */
header{background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top,0px)) 26px 12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.marca{display:flex;align-items:center;gap:11px}
.marca .sep{width:1px;height:20px;background:var(--line)}
.marca .prod{font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--tinta);letter-spacing:-.02em}
.demo{font-size:11px;color:var(--naranja);background:var(--duraznoSuave);padding:4px 11px;border-radius:99px;font-weight:600;
  border:1px solid #FFD9BF}
nav{margin-left:auto;display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:99px}
nav button{background:none;border:none;color:var(--muted);padding:8px 15px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s}
nav button:hover:not(:disabled){color:var(--tinta)}
nav button.on{background:var(--surface);color:var(--morado);box-shadow:0 1px 3px rgba(33,11,80,.1)}
nav button:disabled{opacity:.3;cursor:not-allowed}

main{max-width:1180px;margin:0 auto;padding:30px 26px 80px}

/* Botones */
.btn{background:var(--morado);color:#fff;border:1px solid var(--morado);padding:12px 22px;border-radius:99px;
  font-size:14px;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 10px rgba(86,1,217,.22)}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(86,1,217,.28)}
.btn.sec{background:var(--lilaSuave);color:var(--morado);border-color:transparent;box-shadow:none}
.btn.sec:hover:not(:disabled){background:var(--peri)}
.btn.link{background:none;border:none;color:var(--morado);padding:0;font-size:13.5px;font-weight:600;box-shadow:none}
.btn.link:hover{text-decoration:underline;transform:none;box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.chip{font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:99px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-sustentado,.s-declarado{color:var(--morado);background:var(--lilaSuave)}
.s-debil,.s-insinuado{color:var(--ambar);background:var(--duraznoSuave)}
.s-ausente{color:#fff;background:var(--grisOsc)}
.s-ausente::before{background:var(--naranjaClaro)}
.ej{font-size:10.5px;color:var(--morado);background:var(--lilaSuave);padding:2px 9px;border-radius:99px;font-weight:600}

/* Inicio */
.hero{display:grid;grid-template-columns:1.5fr .68fr;gap:36px;align-items:center;
  background:linear-gradient(120deg,#F3ECFF 0%,#EEE3FF 45%,#FFF0E5 100%);
  border-radius:28px;padding:40px 42px 38px;margin-bottom:26px}
@media(max-width:820px){.hero{grid-template-columns:1fr}.heroArt{display:none}}
.hero h1{font-size:40px;line-height:1.12;margin:10px 0 16px;max-width:22ch;text-wrap:balance}
.hero p{color:#4A4B58;max-width:58ch;font-size:15.5px;line-height:1.65;margin:0}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--morado);
  background:rgba(255,255,255,.7);padding:6px 14px;border-radius:99px}
.kicker b{color:var(--naranja)}
.heroArt{display:flex;justify-content:center}

.pasos{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin:0 0 22px}
.paso{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.paso::after{content:"";position:absolute;right:-26px;top:-26px;width:70px;height:70px;border-radius:50%;background:var(--lilaSuave);opacity:.55}
.paso i{font-style:normal;color:var(--naranja);font-size:12px;font-weight:700;position:relative}
.paso b{display:block;font-family:var(--display);font-size:15px;margin:4px 0 4px;position:relative;color:var(--tinta)}
.paso span{font-size:13.5px;color:var(--muted);position:relative}

textarea{width:100%;border:1px solid var(--line);border-radius:var(--rs);padding:14px;font-size:14.5px;line-height:1.6;
  font-family:var(--sans);resize:vertical;color:var(--ink);background:#FCFBFE;transition:border-color .15s}
textarea:focus{border-color:var(--lila);background:var(--surface)}
.drop{border:1.5px dashed var(--lila);border-radius:var(--rs);padding:18px;text-align:center;color:var(--muted);
  font-size:13.5px;margin-top:14px;background:var(--lilaSuave);transition:all .18s}
.drop.over{border-color:var(--morado);background:var(--peri)}
details summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
input[type=password],input[type=text]{border:1px solid var(--line);border-radius:99px;padding:11px 16px;font-size:13.5px;font-family:var(--sans);width:100%}

/* Chat */
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.doc{position:sticky;top:84px;max-height:78vh;overflow:auto}
.doc pre{white-space:pre-wrap;font-family:var(--serif);font-size:13.5px;line-height:1.7;margin:0;color:#3A3B47}
.thread{display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:12px;align-items:flex-start;animation:rise .4s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.av{width:32px;height:32px;border-radius:50%;flex:0 0 32px;margin-top:2px;
  background:linear-gradient(135deg,var(--morado),#8B3BFF 60%,var(--naranja));display:flex;align-items:center;justify-content:center}
.av svg{width:17px;height:17px}
.burb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);border-top-left-radius:6px;
  padding:18px 20px;flex:1;box-shadow:0 1px 2px rgba(33,11,80,.04)}
.burb h3{margin:0 0 9px;font-size:16.5px}
.burb p{margin:0 0 9px}.burb p:last-child{margin-bottom:0}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lila);margin-right:5px;animation:bl 1.3s infinite}
.typing span:nth-child(2){animation-delay:.18s;background:var(--naranjaClaro)}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

/* Semáforo */
.sem{border-radius:var(--rs);padding:20px 22px;display:flex;gap:18px;align-items:center}
.luz{width:52px;height:52px;border-radius:50%;flex:0 0 52px;display:flex;align-items:center;justify-content:center}
.luz svg{width:26px;height:26px}
.sem b{font-family:var(--display);font-size:21px;display:block;letter-spacing:-.02em}
.sem small{color:var(--muted);display:block;font-size:12.5px;margin-top:7px}

/* Criterios */
.crit{border-top:1px solid var(--paper);padding:15px 0}
.crit:first-child{border-top:none}
.crit .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.crit .top strong{font-family:var(--display);font-size:15px;color:var(--tinta)}
.barra{height:6px;border-radius:99px;background:var(--paper);margin:9px 0 10px;overflow:hidden}
.barra i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.3,.8,.3,1)}
.cita{font-family:var(--serif);font-size:13.5px;border-left:3px solid var(--lila);padding:2px 0 2px 12px;margin:6px 0 7px;color:#3A3B47}
.nota{font-size:13.5px;color:var(--muted)}
.voto{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.voto button{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 15px;font-size:12.5px;
  font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.voto button:hover{border-color:var(--lila);color:var(--morado)}
.marca2{font-size:12.5px;padding:9px 13px;border-radius:var(--rs);margin-top:10px}
.marca2.ok{background:var(--lilaSuave);color:var(--morado)}
.marca2.no{background:var(--duraznoSuave);color:var(--ambar)}

/* Preguntas */
.preg{border-top:1px solid var(--paper);padding:16px 0}
.preg:first-of-type{border-top:none}
.preg .q{font-size:15px;margin-bottom:9px;color:var(--tinta)}
.preg .src{font-size:11px;color:var(--faint);font-weight:600}
.preg textarea{font-size:13.5px}
.progreso{font-size:13px;color:var(--muted);font-weight:600}
.barraP{height:7px;background:var(--paper);border-radius:99px;overflow:hidden;margin:8px 0 16px}
.barraP i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--morado),var(--naranja));transition:width .5s ease}

/* Acta */
.acta{border:1px solid var(--line);border-radius:var(--r);padding:26px;background:var(--surface);
  box-shadow:0 8px 30px rgba(33,11,80,.07)}
.acta h2{font-size:23px;margin:0 0 3px}
.acta h3{font-family:var(--display);font-size:16px;margin:0 0 7px;color:var(--tinta)}
.bloque{margin-bottom:20px}
.bloque .n{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--lilaSuave);color:var(--morado);
  font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-right:9px;font-family:var(--sans)}
.acta ul{margin:0;padding-left:18px}

/* Expedientes */
.exp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;gap:16px;margin-bottom:12px;transition:box-shadow .18s}
.exp:hover{box-shadow:0 4px 18px rgba(33,11,80,.07)}
.exp .lat{width:8px;border-radius:99px;flex:0 0 8px}
.exp input.nom{border:1px solid transparent;background:none;font-family:var(--display);font-size:15px;font-weight:600;
  padding:4px 7px;border-radius:8px;width:min(640px,100%);color:var(--tinta)}
.exp input.nom:hover{border-color:var(--line);background:var(--paper)}
.acciones{display:flex;gap:16px;margin-top:11px;padding-left:7px;flex-wrap:wrap}
.vs{background:var(--paper);border-radius:var(--rs);padding:16px;margin-top:13px}
.vs .fila{display:flex;gap:10px;align-items:center;font-size:13.5px;margin-bottom:7px}
.vs .fila.igual{opacity:.4}
.aviso{background:var(--duraznoSuave);color:var(--cafe);padding:13px 18px;border-radius:var(--rs);font-size:13.5px;
  margin-bottom:16px;border:1px solid #FFD9BF}

.ejemplo{background:var(--duraznoSuave);border-radius:var(--rs);padding:14px 16px;margin-top:11px;font-family:var(--serif);font-size:13.5px;color:#4A3520;line-height:1.6}
.ejemplo .et{font-family:var(--sans);font-size:10.5px;font-weight:700;color:var(--naranja);margin-bottom:7px}
.ejemplo .pie{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:9px}
.pregunta{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.pregunta label{display:block;font-family:var(--display);font-size:15px;font-weight:600;color:var(--tinta);margin-bottom:10px}
.pregunta .fila{display:flex;gap:10px;flex-wrap:wrap}
.pregunta input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:99px;padding:12px 18px;font-size:14px;font-family:var(--sans)}
.pregunta input:focus{border-color:var(--lila);outline:none}
.pregunta .sug{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.msg.yo{flex-direction:row-reverse}
.msg.yo .burb{background:var(--lilaSuave);border-color:transparent;border-radius:var(--r);border-top-right-radius:6px;flex:0 1 auto;max-width:78%;color:var(--tinta)}
.ciclo{display:flex;gap:6px;margin-top:10px;padding-left:7px;flex-wrap:wrap;align-items:center}
.ciclo button{background:var(--paper);border:1px solid transparent;border-radius:99px;padding:5px 13px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.ciclo button.on{background:var(--lilaSuave);color:var(--morado)}
.ciclo input{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:12.5px;min-width:260px;flex:1;font-family:var(--sans)}
.decision{background:var(--lilaSuave);border-radius:var(--rs);padding:11px 14px;margin-top:10px;font-size:13px;color:var(--tinta)}


.tabla{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tabla .fila{display:grid;grid-template-columns:1.1fr 1.6fr 1.6fr .9fr auto;gap:10px;padding:10px 14px;align-items:center;border-top:1px solid var(--paper)}
.tabla .fila.cab{background:var(--lilaSuave);font-size:11.5px;font-weight:700;color:var(--morado);border:none;padding:11px 14px}
.tabla .fila input{border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 9px;font-size:13.5px;font-family:var(--sans);width:100%;color:var(--ink)}
.tabla .fila input:hover{border-color:var(--line)}
.tabla .fila input:focus{border-color:var(--lila);background:var(--paper);outline:none}
@media(max-width:760px){.tabla .fila{grid-template-columns:1fr 1fr}.tabla .fila.cab{display:none}}
.vacio{background:var(--surface);border:1.5px dashed var(--lila);border-radius:var(--r);padding:38px 30px;text-align:center;max-width:64ch;margin:0 auto}
.vacio h3{font-size:19px;margin:0 0 10px}
.vacio p{color:var(--muted);font-size:14px;margin:0 auto 8px;max-width:52ch}
.meta3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.meta3 label{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.meta3 input{border:1px solid var(--line);border-radius:99px;padding:10px 15px;font-size:13.5px;font-family:var(--sans);color:var(--ink)}
.meta3 input:focus{border-color:var(--lila);outline:none}
.metaActa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 20px;padding:14px 0;border-top:1px solid var(--paper);border-bottom:1px solid var(--paper)}
.metaActa div{font-size:13.5px;color:var(--tinta);font-weight:600}
.metaActa span{display:block;font-size:10.5px;font-weight:700;color:var(--faint);margin-bottom:3px}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini .chip{font-size:10.5px}
#areaImpresion{display:none}
@media print{
  body{background:#fff}
  header,footer,nav,main{display:none!important}
  #areaImpresion{display:block;padding:0;font-family:Georgia,serif;font-size:11.5pt;line-height:1.5;color:#000}
  #areaImpresion h1{font-size:20pt}#areaImpresion h2{font-size:13pt;margin-top:18pt}#areaImpresion h3{font-size:11.5pt;margin-bottom:2pt}
}


.paso svg{display:block;margin-bottom:10px;position:relative}
.paso::after{display:none}
.vacio svg{display:block;margin:0 auto 14px}
.av{background:none!important}
.av svg{width:34px;height:34px}
.heroArt svg{max-width:100%;height:auto}


/* Acentos de color en piezas pequeñas. El blanco sigue mandando. */
.burb > h3{display:flex;align-items:center;gap:10px}
.burb > h3::before{content:"";width:5px;height:19px;border-radius:99px;flex:0 0 5px;
  background:linear-gradient(180deg,var(--morado),var(--naranja))}
.bloque .n{background:linear-gradient(135deg,var(--morado),var(--naranja));color:#fff}
.acta h2{display:flex;align-items:center;gap:11px}
.acta h2::before{content:"";width:6px;height:24px;border-radius:99px;
  background:linear-gradient(180deg,var(--morado),var(--naranja))}
.tituloV{display:flex;align-items:center;gap:11px;margin:0}
.tituloV::before{content:"";width:6px;height:26px;border-radius:99px;
  background:linear-gradient(180deg,var(--morado),var(--naranja))}
.paso{background:linear-gradient(180deg,#FCFAFF,#FFFFFF 42%)}
.paso::before{content:"";position:absolute;left:0;top:0;height:4px;width:58px;
  border-radius:0 99px 99px 0;background:linear-gradient(90deg,var(--morado),var(--naranja))}
.kicker{background:linear-gradient(120deg,rgba(255,255,255,.92),rgba(255,255,255,.62));
  box-shadow:inset 0 0 0 1px rgba(86,1,217,.12)}
.chip::before{background:currentColor;opacity:.85}
.s-sustentado{background:linear-gradient(120deg,#EFE6FF,#E6DBFF)}
.s-debil{background:linear-gradient(120deg,#FFF3E6,#FFE9D5)}
.exp .lat{background:linear-gradient(180deg,var(--c1,var(--morado)),var(--c2,var(--naranja)))}
.tabla .fila.cab{background:linear-gradient(90deg,#EFE6FF,#F7F0FF 55%,#FFF3E9)}
.vs{background:linear-gradient(180deg,#FAF8FF,#F5F3FA)}
.ciclo button.on{background:linear-gradient(120deg,#EFE6FF,#E8DEFF)}
.pregunta{background:linear-gradient(180deg,#FFFFFF,#FCFAFF)}
.pregunta label{display:flex;align-items:center;gap:10px}
.pregunta .sub{font-size:13.5px;color:var(--muted);margin:8px 0 12px;max-width:58ch}
.pregunta label::before{content:"";width:5px;height:18px;border-radius:99px;flex:0 0 5px;
  background:linear-gradient(180deg,var(--naranja),var(--morado))}
.metaActa span{background:linear-gradient(90deg,var(--morado),var(--naranja));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.luz{background-image:radial-gradient(circle at 32% 26%,rgba(255,255,255,.42),rgba(255,255,255,0) 62%)}
header{background-image:linear-gradient(90deg,rgba(86,1,217,.05),rgba(252,99,14,.04) 70%,transparent)}
nav button.on{background:linear-gradient(135deg,#FFFFFF,#F7F2FF)}


/* Los tres momentos */
.migas{display:flex;align-items:center;gap:18px;margin:0 0 18px;flex-wrap:wrap}
.migas .ruta{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--faint);font-weight:600}
.migas .ruta span{padding:5px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.migas .ruta span.on{color:var(--morado);border-color:transparent;background:linear-gradient(120deg,#EFE6FF,#E8DEFF)}
.siguiente{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  background-image:linear-gradient(120deg,#FCFAFF,#FFFFFF 55%,#FFF8F2)}
.siguiente b{display:block;font-family:var(--display);font-size:16px;color:var(--tinta)}
.siguiente span{display:block;font-size:13.5px;color:var(--muted);margin-top:3px;max-width:52ch}
.focoQ{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px}
.cabQ{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  font-size:12.5px;font-weight:600;color:var(--muted)}
.puntos{display:flex;gap:6px}
.pt{width:10px;height:10px;border-radius:50%;border:none;padding:0;cursor:pointer;background:var(--line)}
.pt.ok{background:linear-gradient(135deg,var(--morado),var(--naranja))}
.pt.on{box-shadow:0 0 0 3px var(--lilaSuave)}
.qtxt{font-size:21px;line-height:1.3;margin:6px 0 6px}
.focoQ .src{font-size:12px;color:var(--faint);margin-bottom:14px}
.focoQ textarea{font-size:15px}
.accQ{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.accQ .nav{display:flex;gap:10px;margin-left:auto}
.split.informe{grid-template-columns:1.95fr 1fr}


.nivel{margin-top:14px}
.nivel .nt{font-family:var(--display);font-size:13.5px;font-weight:700;color:var(--tinta);display:flex;align-items:center;gap:8px}
.nivel .nt::before{content:"";width:4px;height:15px;border-radius:99px;background:linear-gradient(180deg,var(--morado),var(--naranja))}
.nivel.mejora .nt::before{background:var(--line)}
.nivel.mejora .nt{color:var(--muted)}
.nivel .nn{font-size:12.5px;color:var(--faint);margin-top:4px;padding-left:12px}


.marcador{width:64px;height:64px;border-radius:50%;border:3px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 64px;background:#fff}
.marcador b{font-family:var(--display);font-size:22px;line-height:1}
.marcador span{font-size:9.5px;color:var(--faint);margin-top:1px}
.ficha{border:1px solid var(--line);border-radius:var(--rs);padding:16px 18px;background:linear-gradient(180deg,#FCFAFF,#fff)}
.ficha .fh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ficha .fh b{font-family:var(--display);font-size:15.5px;display:block;color:var(--tinta)}
.ficha .fh span{font-size:12.5px;color:var(--muted);display:block;margin-top:3px;max-width:48ch}
.ficha .rice{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;text-align:right}
.ficha .rice i{display:block;font-style:normal;font-size:11.5px;font-weight:600;margin-top:3px}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.campos label{font-size:11.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.campos input,.campos select{border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13.5px;font-family:var(--sans);width:100%}
.campos .cx{display:flex;align-items:center;gap:6px}
.campos .cx span{font-size:11px;color:var(--faint);white-space:nowrap}
.campos .fijo{border:1px dashed var(--lila);border-radius:10px;padding:8px 11px;font-size:13.5px;font-weight:700;background:var(--lilaSuave)}
.campos em{font-style:normal;font-weight:500;font-size:10.5px;color:var(--faint);line-height:1.35}
.faltaR{font-size:12.5px;color:var(--ambar);background:var(--duraznoSuave);padding:9px 12px;border-radius:10px;margin-top:12px}
.cuad{margin-top:12px;padding-top:12px;border-top:1px solid var(--paper)}
.cuad b{font-family:var(--display);font-size:14px;color:var(--tinta)}
.cuad span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.leyenda{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-top:18px}
.leyenda .lz b{font-family:var(--display);font-size:16px;color:var(--tinta)}
.leyenda .lz p{font-size:13.5px;color:var(--muted);margin:4px 0 0}
.ejes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:16px}
.ejes>div>b{font-family:var(--display);font-size:13.5px;color:var(--morado)}
.ejes p{font-size:12.5px;color:var(--muted);margin:5px 0 9px;line-height:1.5}
.ejes .ad{color:var(--ambar)}
.nv{font-size:12.5px;color:var(--muted);display:flex;align-items:baseline;gap:7px;margin-bottom:4px}
.nv span{width:9px;height:9px;border-radius:50%;flex:0 0 9px;position:relative;top:1px}
.nv b{color:var(--tinta)}
.cuadros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.q{border-radius:12px;padding:11px 13px;font-size:12px}
.q b{display:block;font-family:var(--display);font-size:12.5px}
.q span{color:var(--muted)}
.q1{background:var(--lilaSuave)}.q1 b{color:var(--morado)}
.q2{background:var(--duraznoSuave)}.q2 b{color:var(--ambar)}
.q3{background:var(--peri)}.q3 b{color:var(--tinta)}
.q4{background:var(--paper)}.q4 b{color:var(--muted)}
.marcas{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;padding-left:5px}
.pill{font-size:11.5px;font-weight:700;padding:3px 11px;border-radius:99px}
.pill.cu{color:var(--muted);background:var(--paper)}


.filtros{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.fx{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 15px;font-size:12.5px;
  font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s}
.fx:hover{border-color:var(--lila)}
.fx i{width:8px;height:8px;border-radius:50%;display:block}
.fx b{font-size:11px;opacity:.7}
.fx.on{font-weight:700}


/* ====== Proceso en tres pasos ====== */
.proceso{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.volver{background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;padding:6px 0}
.volver:hover{color:var(--morado)}
.pasos3{display:flex;align-items:center;gap:0;background:var(--surface);border:1px solid var(--line);
  border-radius:99px;padding:6px;flex-wrap:wrap}
.p3{display:flex;align-items:center;gap:10px;background:none;border:none;border-radius:99px;
  padding:8px 16px 8px 9px;cursor:pointer;text-align:left;transition:all .18s}
.p3:disabled{cursor:not-allowed;opacity:.45}
.p3 i{width:26px;height:26px;border-radius:50%;background:var(--paper);color:var(--muted);font-style:normal;
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.p3 b{display:block;font-family:var(--display);font-size:13.5px;color:var(--muted);letter-spacing:-.01em}
.p3 span{display:block;font-size:11px;color:var(--faint);margin-top:1px}
.p3.activo{background:linear-gradient(120deg,#EFE6FF,#F6F1FF)}
.p3.activo i{background:linear-gradient(135deg,var(--morado),var(--naranja));color:#fff}
.p3.activo b{color:var(--morado)}
.p3.hecho i{background:#E6F4EC;color:#1E7A4B}
.p3.hecho b{color:var(--tinta)}
.ln{width:26px;height:2px;background:var(--line);border-radius:2px;flex:0 0 26px}
.ln.on{background:linear-gradient(90deg,var(--morado),var(--naranja))}
@media(max-width:700px){.pasos3{border-radius:20px}.p3 span{display:none}}

/* ====== Flujo de la lectura ====== */
.flujo{display:flex;flex-direction:column;gap:18px}
.bloqueA .sem{padding:22px 24px}
.tarjeta{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.tarjeta .th{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.tarjeta h3{font-size:16.5px;margin:0;letter-spacing:-.02em}
.tarjeta .sub{font-size:13.5px;color:var(--muted);margin:6px 0 0;line-height:1.6;max-width:62ch}
.resumen{display:flex;gap:7px;flex-wrap:wrap}
.mini-chip{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:99px}
.leyendita{font-size:12.5px;color:var(--muted);background:var(--paper);border-radius:10px;padding:10px 13px;
  margin:12px 0 10px;line-height:1.7}
.leyendita b{color:var(--tinta)}
.cols{display:grid;grid-template-columns:1fr;gap:16px;margin-top:6px}
.btn.mini{font-size:12.5px;padding:0}
.btn.sec.mini{padding:8px 15px;font-size:12.5px;margin-top:12px}
.crits{margin-top:6px}
.cruce{border-top:1px solid var(--paper);padding:11px 0;font-size:13.5px;line-height:1.55}
.cruce strong{text-transform:capitalize;color:var(--tinta)}
.cruce .sq{color:var(--faint);font-size:12px}
.cruce div{color:var(--muted)}
.nada{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.limite{font-size:12.5px;color:var(--ambar);margin-top:12px;background:var(--duraznoSuave);padding:9px 12px;border-radius:10px}
.lista{margin:10px 0 0;padding-left:20px;font-size:14.5px;line-height:2}
.avisos{display:flex;flex-direction:column;gap:8px}
.avisos div{background:var(--lilaSuave);color:var(--tinta);border-radius:12px;padding:12px 16px;font-size:13.5px;line-height:1.55}

/* ====== Botón de avanzar ====== */
.avanzar{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;text-align:left;
  background:linear-gradient(120deg,var(--morado),#7B2BEA 62%,var(--naranja));color:#fff;border:none;
  border-radius:var(--r);padding:22px 26px;cursor:pointer;box-shadow:0 8px 26px rgba(86,1,217,.26);
  transition:transform .16s,box-shadow .16s}
.avanzar:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 34px rgba(86,1,217,.32)}
.avanzar span{display:block;font-size:11.5px;font-weight:700;opacity:.82;letter-spacing:.04em;text-transform:uppercase}
.avanzar b{display:block;font-family:var(--display);font-size:20px;margin-top:4px;letter-spacing:-.02em}
.avanzar em{display:block;font-style:normal;font-size:13px;opacity:.86;margin-top:5px;max-width:52ch;line-height:1.5}
.avanzar i{font-style:normal;font-size:26px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;flex:0 0 52px}
.avanzar.off{background:var(--surface);color:var(--muted);box-shadow:none;border:1px dashed var(--line);cursor:not-allowed}
.avanzar.off b{color:var(--tinta)}
.avanzar.off i{background:var(--paper);color:var(--faint)}

/* ====== Documento con su formato ====== */
.docfmt{font-family:var(--serif);font-size:13.5px;line-height:1.7;color:#3A3B47}
.docfmt h1,.docfmt h2,.docfmt h3{font-family:var(--display);color:var(--tinta);margin:16px 0 6px;line-height:1.3}
.docfmt h1{font-size:16px}.docfmt h2{font-size:14.5px}.docfmt h3{font-size:13.5px}
.docfmt p{margin:0 0 9px}
.docfmt ul,.docfmt ol{margin:0 0 10px;padding-left:20px}
.docfmt li{margin-bottom:3px}
.docfmt table{border-collapse:collapse;width:100%;margin:10px 0;font-size:11.5px;font-family:var(--sans)}
.docfmt td,.docfmt th{border:1px solid var(--line);padding:5px 7px;vertical-align:top;text-align:left}
.docfmt th,.docfmt tr:first-child td{background:var(--lilaSuave);font-weight:700;color:var(--tinta)}
.docfmt strong{color:var(--tinta)}


.comofunciona{margin:0 0 24px}
.cf-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.cf-h b{font-family:var(--display);font-size:17px;color:var(--tinta);display:flex;align-items:center;gap:10px}
.cf-h b::before{content:"";width:5px;height:19px;border-radius:99px;background:linear-gradient(180deg,var(--morado),var(--naranja))}
.cf-h span{font-size:13px;color:var(--muted)}
.pasos{gap:16px}
.paso{padding:20px}
.paso span{line-height:1.6;display:block;margin-top:5px}


.similar{display:flex;gap:14px;align-items:flex-start;border-radius:var(--r);padding:18px 22px;border:1px solid}
.similar.no{background:#E9F5EE;border-color:#BFE3CE}
.similar.nd{background:var(--paper);border-color:var(--line)}
.similar.nd i{background:var(--faint)}
.similar.si{background:var(--duraznoSuave);border-color:#FFD9BF}
.similar i{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-weight:700;font-size:15px;color:#fff}
.similar.no i{background:#1E7A4B}
.similar.si i{background:var(--naranja)}
.similar b{font-family:var(--display);font-size:15px;color:var(--tinta);display:block}
.similar p{font-size:13.5px;color:#45464F;margin:6px 0 0;line-height:1.55}
.similar .sq{color:var(--muted);font-size:12px}
.similar em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:8px}


.evaluadas{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-top:20px}
.evaluadas .th{align-items:center}
.subt{font-family:var(--display);font-size:16.5px;margin:0;color:var(--tinta);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.subt::before{content:"";width:5px;height:18px;border-radius:99px;background:linear-gradient(180deg,var(--morado),var(--naranja))}
h2.subt{margin-top:28px}
.buscar{border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:13px;font-family:var(--sans);min-width:260px}
.buscar:focus{border-color:var(--lila);outline:none}
.grupoSq{margin-top:14px}
.sqh{font-size:11.5px;font-weight:700;color:var(--morado);text-transform:uppercase;letter-spacing:.05em;
  display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--paper)}
.sqh b{background:var(--lilaSuave);border-radius:99px;padding:1px 8px;font-size:10.5px}
.fi{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--paper)}
.fi .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.fin{flex:1;min-width:0}
.fin b{font-size:14px;color:var(--tinta);display:block}
.fin span{font-size:11.5px;color:var(--faint)}


main{padding:34px 26px 90px}
.split{gap:26px}
.tarjeta{padding:24px 26px}
.tarjeta h3{line-height:1.35}
.tarjeta .sub,.leyendita{max-width:70ch}
.burb{padding:20px 22px;line-height:1.62}
.burb p,.burb li{max-width:66ch}
.crit{padding:16px 0}
.crit .nota{line-height:1.6;max-width:68ch}
.cita{line-height:1.6;margin:8px 0 8px}
.doc{padding:22px 24px}
.docfmt{line-height:1.75}
.acta{padding:30px 32px}
.acta .bloque{margin-bottom:22px}
.bloque div,.acta li{line-height:1.65}
.focoQ{padding:30px 32px}
.qtxt{line-height:1.35;max-width:32ch;font-size:22px}
.avanzar{padding:24px 28px}
.exp{padding:20px 22px}
.leyenda{padding:24px 26px}
.ejes p{max-width:60ch}
.vacio p{line-height:1.65}
.similar{padding:20px 24px}
.similar p{max-width:64ch}
.evaluadas{padding:24px 26px}
.pregunta{padding:22px 24px}
.pregunta .sub{max-width:62ch}
@media(min-width:1100px){.split{grid-template-columns:1.62fr 1fr}.split.informe{grid-template-columns:2fr 1fr}}


.filtros.chico .fx{padding:6px 13px;font-size:12px}
.soloL{font-size:12px;color:var(--muted);background:var(--paper);padding:6px 14px;border-radius:99px}
.fi{cursor:pointer;border-radius:10px;padding-left:8px;padding-right:8px;transition:background .14s}
.fi:hover{background:var(--paper)}
.fi .ver{font-size:12px;font-weight:700;color:var(--morado);opacity:0;transition:opacity .14s;white-space:nowrap}
.fi:hover .ver{opacity:1}
.qa{border-top:1px solid var(--paper);padding:13px 0}
.qa b{font-size:14px;color:var(--tinta);display:block;line-height:1.5}
.qa p{font-size:13.5px;color:var(--muted);margin:5px 0 0;line-height:1.6;max-width:66ch}


/* ====== Matriz ====== */
.matriz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px;margin-top:18px}
.matriz .th{align-items:center;margin-bottom:12px}
.hint{font-size:12.5px;color:var(--muted)}
.mwrap{overflow-x:auto}
.grafo{width:100%;min-width:620px;height:auto;display:block}
.grafo .eje{stroke:#DCD6EC;stroke-width:1.5;stroke-dasharray:5 5}
.grafo .qt{font-family:var(--display);font-size:12.5px;font-weight:700;fill:#9B93B5}
.grafo .qd{font-size:10.5px;fill:#B3ACC6}
.grafo .ax{font-size:10.5px;fill:var(--faint)}
.grafo .axt{font-size:11.5px;font-weight:700;fill:var(--muted)}
.grafo .bcod{font-size:12.5px;font-weight:800;fill:#fff;pointer-events:none;letter-spacing:.02em}
.burbuja{cursor:pointer}
.burbuja circle{transition:transform .16s,fill-opacity .16s;transform-origin:center;transform-box:fill-box}
.burbuja:hover circle{fill-opacity:1;transform:scale(1.08)}
.mleyenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px;margin-top:16px;
  border-top:1px solid var(--paper);padding-top:16px}
.mleyenda b{font-family:var(--display);font-size:13px;color:var(--tinta);display:block;margin-bottom:3px}
.mleyenda span{font-size:12.5px;color:var(--muted);line-height:1.55}
.mleyenda i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 9px;position:relative;top:1px}
.sinubicar{background:var(--paper);border-radius:var(--rs);padding:14px 16px;margin-top:16px}
.sinubicar b{font-size:13px;color:var(--tinta);display:block}
.sinubicar span{font-size:12.5px;color:var(--muted);display:block;margin-top:3px;line-height:1.5}
.sinubicar .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.sinubicar .pill{border:none;cursor:pointer;font-family:var(--sans)}

/* ====== Podio ====== */
.podio{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px;margin-top:18px}
.lista-podio{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.pp{display:flex;align-items:center;gap:13px;background:var(--paper);border:1px solid transparent;border-radius:14px;
  padding:12px 15px;cursor:grab;transition:all .14s}
.pp:hover{border-color:var(--lila);background:#FBF9FF}
.pp.sobre{border-color:var(--morado);background:var(--lilaSuave);transform:translateY(-1px)}
.puesto{width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:13.5px;
  color:var(--muted);flex:0 0 30px}
.puesto.top1{background:linear-gradient(135deg,#F5C24B,#E0982A);color:#fff;border-color:transparent}
.puesto.top2{background:linear-gradient(135deg,#D3D7DE,#AEB4BF);color:#fff;border-color:transparent}
.puesto.top3{background:linear-gradient(135deg,#E0A579,#C07C4A);color:#fff;border-color:transparent}
.pp .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.ppn{flex:1;min-width:0}
.ppn b{font-size:14px;color:var(--tinta);display:block}
.ppn span{font-size:11.5px;color:var(--faint)}
.agarre{color:var(--faint);font-size:14px;letter-spacing:-2px;cursor:grab}

/* ====== Filtro por squad ====== */
.fila-filtros{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
.selsq{border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:12.5px;font-family:var(--sans);
  font-weight:600;color:var(--tinta);background:var(--surface)}
.selsq:focus{border-color:var(--lila);outline:none}


/* ====== Por qué estas preguntas ====== */
.porque{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;margin-bottom:16px}
.porque b{font-family:var(--display);font-size:15px;color:var(--tinta);display:flex;align-items:center;gap:9px}

const PRD_V1=`Alertas de consumo en tiempo real
Squad: Card Experience - Payments

1. Contexto
Muchos usuarios de Spin by OXXO usan su tarjeta y no saben cuánto llevan gastado en el mes.

2. Problema
Los usuarios se enteran de sus consumos hasta el corte. Eso genera frustración y sensación de poco control sobre su dinero.

3. Solución
Mandar una notificación push con el monto y el comercio apenas se registra el movimiento. También mostrar un acumulado del mes dentro de la app.

Creemos que esto va a mejorar mucho la experiencia y la percepción de control. Es algo que piden los usuarios en las reseñas de la tienda.

Arrancamos cuando desarrollo tenga espacio.`;

const PRD_V2=`Alertas de consumo en tiempo real
Squad: Card Experience - Payments
Dueño del documento: PM de Card Experience

1. Contexto
La tarjeta es uno de los flujos centrales de Spin by OXXO: el 29% de los MAUs hace cash out con tarjeta y el consumo crece mes a mes. Hoy el usuario no tiene visibilidad de su gasto hasta el corte.

2. Problema
Los tarjetahabientes nuevos activan la tarjeta y dejan de usarla en las primeras dos semanas. El análisis de 1,400 reseñas de tienda entre junio y agosto muestra que el 31% menciona que no sabe cuánto lleva gastado.

3. Oportunidad
Hipótesis: si el usuario ve cada consumo en el momento en que ocurre, entonces mantiene la tarjeta activa más allá de la semana 4.

KPI primario: porcentaje de tarjetas activadas con al menos tres consumos en la semana 4.
Hoy estamos en 38%. Target conservador 44%, optimista 47%. Medición: dashboard de activación, a 60 días del lanzamiento.

4. Solución

const PRD_MM=`Límites dinámicos por perfil de riesgo
Squad: Money Movement - Payments
Dueño del documento: PM de Money Movement · Tech Lead y Riesgos como stakeholders

1. Contexto
SPEI Out es uno de los flujos más usados de Spin by OXXO: el 62% de los MAUs envía dinero, y el 88% lo hace a cuentas de terceros. Hoy todos los usuarios comparten el mismo límite de transferencia, sin importar su historial.

2. Problema
Los usuarios con buen historial chocan con el mismo tope que un usuario nuevo. El tablero de Operaciones registra 1,400 solicitudes manuales de aumento de límite al mes, medidas entre mayo y agosto, que hoy se resuelven a mano y tardan hasta 48 horas.

3. Oportunidad
Hipótesis: si el límite sube solo cuando el perfil de riesgo lo permite, entonces bajan las solicitudes manuales y aumenta el volumen transaccionado por los usuarios de mayor antigüedad.

KPI primario: solicitudes manuales de aumento por cada mil usuarios activos. Hoy son 9. Target conservador 6, optimista 4,5. Medición: dashboard de Operaciones, a 90 días.
KPI secundario: volumen SPEI Out del segmento habilitado.

4. Diferenciador frente al mercado
Los bancos tradicionales exigen trámite en sucursal o llamada para subir el límite. Ninguna fintech del mercado local lo hace automático por perfil de riesgo: sería un diferenciador sostenible.

5. Solución
Motor de reglas que ajusta el límite según el perfil de riesgo del usuario, sin que tenga que pedirlo.

6. Plan de entrega
Fase 1: usuarios con más de doce meses de antigüedad y sin incidencias. Fase 2: resto del segmento elegible. Si la fase 1 no baja las solicitudes, sale sin la fase 2 y se revisa la tabla de perfiles.

7. Dependencias y riesgos
Riesgos define la tabla de perfiles. Data instrumenta el evento de cambio de límite. Legal revisa la comunicación al usuario. El motor de reglas actual no soporta condiciones compuestas: arrancamos con tres reglas simples. Podemos desactivar con feature flag.

8. Qué no vamos a hacer
No aplica a usuarios nuevos ni cambia el proceso de KYC.`;

function frases(t){return t.split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(s=>s.length>20);}
function corta(s,n){s=(s||"").replace(/\s+/g," ").trim();const w=s.split(" ");n=n||16;return w.length>n?w.slice(0,n).join(" ")+"…":s;}
function hay(fs,re){return fs.find(s=>re.test(s));}
function mejor(fs,re,extra){
  const cand=fs.filter(s=>re.test(s));
  if(!cand.length)return "";
  return cand.map(s=>{
    let p=0;
    if(/\d/.test(s))p+=3;
    if(/%|trx|MAU|puntos|mil|millones/.test(s))p+=2;
    if(extra&&extra.test(s))p+=4;
    if(s.length>60&&s.length<220)p+=1;
    return[p,s];
  }).sort((a,b)=>b[0]-a[0])[0][1];
}
function contar(t,re){return (t.match(re)||[]).length;}

/* ---- Un evaluador por criterio, con el estándar de los PRDs de Spin ---- */
const EVAL={
 /* 1. Alineación: a qué objetivo de negocio le pega y cuánto pesa */
 c1(t,fs){
  const obj=hay(fs,OBJETIVO);
  if(!obj)return{estado:"ausente",cita:"",nota:"Todavía no dice a qué objetivo de negocio le pega ni qué mueve en Spin."};
  const tam=SENAL.tamano.test(t), mej=SENAL.mejora.test(t);
  if(tam&&mej)return{estado:"sustentado",cita:corta(mejor(fs,SENAL.tamano,OBJETIVO)),nota:"Dice a qué objetivo le pega, cuánto pesa hoy y cuánto espera moverlo."};
  if(tam)return{estado:"sustentado",cita:corta(mejor(fs,SENAL.tamano,OBJETIVO)),nota:"Nombra el objetivo y el peso del flujo en MAUs o volumen."};
  if(mej)return{estado:"débil",cita:corta(mejor(fs,OBJETIVO,SENAL.mejora)),nota:"Hay objetivo y meta, pero no dice qué porcentaje de MAUs o qué volumen toca."};
  return{estado:"débil",cita:corta(obj),nota:"Menciona el objetivo sin decir cuánto pesa hoy ese flujo."};
 },
 /* 2. Evidencia: con qué se sostiene que el problema existe */
 c2(t,fs){
  if(SENAL.mandato.test(t)){
    const cita=corta(mejor(fs,SENAL.mandato));
    if(SENAL.desplaza.test(t))return{estado:"sustentado",cita,nota:"Entra por mandato y dice qué desplaza. Eso basta.",origen:"mandato"};
    return{estado:"débil",cita,nota:"Entra por mandato. No lo cuestiono, pero falta decir qué desplaza.",origen:"mandato"};
  }
  let evc=fs.find(s=>SENAL.evidencia.test(s)&&SENAL.cifra.test(s));
  const ev=hay(fs,SENAL.evidencia);
  if(!evc&&ev){ /* la cifra puede estar cerca, no en la misma frase */
    const pos=t.indexOf(ev.slice(0,40));
    if(pos>=0&&SENAL.cifra.test(t.slice(Math.max(0,pos-260),pos+420)))evc=ev;
  }
  if(evc)return{estado:"sustentado",cita:corta(evc),nota:"Trae análisis con cifra, no una impresión del equipo.",origen:"evidencia"};
  if(ev)return{estado:"débil",cita:corta(ev),nota:"Cita una fuente sin número ni periodo. ¿Cuántos casos y de cuándo?",origen:"evidencia"};
  if(SENAL.cifra.test(t))return{estado:"débil",cita:corta(mejor(fs,SENAL.cifra)),nota:"Hay cifras, pero no dice de qué análisis o dashboard salen.",origen:"dato suelto"};
  if(SENAL.intuicion.test(t))return{estado:"débil",cita:corta(mejor(fs,SENAL.intuicion)),nota:"Es una intuición del equipo. Puede ser correcta, pero no es evidencia.",origen:"supuesto"};
  return{estado:"ausente",cita:"",nota:"Todavía no dice con qué datos se sostiene que esto pasa.",origen:"sin declarar"};
 },
 /* 3. Impacto: hipótesis, KPI primario, target y medición */
 c3(t,fs){
  if(SENAL.vanidad.test(t)&&!SENAL.mejora.test(t))
    return{estado:"débil",cita:corta(mejor(fs,SENAL.vanidad)),nota:"Esa métrica sube aunque el producto no sirva. Necesito una que mida valor."};
  const k=hay(fs,SENAL.kpi)||hay(fs,SENAL.mejora);
  if(!k)return{estado:"ausente",cita:"",nota:"Todavía no hay un número que diga si esto funcionó."};
  const hip=SENAL.hipotesis.test(t), num=SENAL.mejora.test(t), med=SENAL.medicion.test(t), lb=SENAL.base.test(t);
  const cita=corta(mejor(fs,SENAL.kpi,SENAL.mejora));
  if(num&&med&&hip)return{estado:"sustentado",cita,nota:lb?"Hipótesis, KPI con target, medición declarada y línea base.":"Hipótesis, KPI con target y dónde se mide. Falta el valor de hoy."};
  if(num&&med)return{estado:"sustentado",cita,nota:"KPI con target y medición declarada. Sin hipótesis explícita no se sabe qué se está probando."};
  if(num)return{estado:"débil",cita,nota:"Hay target, pero no dice dónde se va a medir ni cuánto vale hoy."};
  return{estado:"débil",cita:corta(k),nota:"Nombra qué va a medir, pero sin target no es una meta."};
 },
 /* 4. Plan de entrega: fases, piloto y qué pasa si la primera no da */
 c4(t,fs){
  const f=hay(fs,SENAL.fases);
  const noEsPlazo=/(m[áa]s de|menos de|hace|[úu]ltim|primer|cada|durante|antig[üu]edad de)\s+\w*\s*(\d+|una?|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|doce)?\s*(semanas?|meses|d[íi]as)/i;
  const plazo=fs.find(s=>SENAL.plazo.test(s)&&!noEsPlazo.test(s)&&!/problema|dejan de|abandonan/i.test(s));
  if(!f&&!plazo&&SENAL.vago.test(t))return{estado:"ausente",cita:corta(mejor(fs,SENAL.vago)),nota:"“Cuando haya espacio” no es un plan. La entrega se decide, no se espera."};
  if(!f&&!plazo)return{estado:"ausente",cita:"",nota:"Todavía no dice cómo saldría: ni fases, ni piloto, ni fecha."};
  if(f&&SENAL.recorte.test(t))return{estado:"sustentado",cita:corta(f,22),nota:"Sale por fases y dice qué pasa si la primera no da los números."};
  if(f)return{estado:"sustentado",cita:corta(f,22),nota:"Hay plan de entrega por fases. Falta decir qué pasa si la primera no rinde."};
  return{estado:"débil",cita:corta(plazo),nota:"Hay una fecha, pero no un plan de salida por fases ni un piloto."};
 },
 /* 5. Dependencias: quién más tiene que entrar y qué hay que instrumentar */
 c5(t,fs){
  const a=hay(fs,SENAL.areas), inst=SENAL.instrumenta.test(t);
  if(a&&inst)return{estado:"sustentado",cita:corta(mejor(fs,SENAL.areas,SENAL.instrumenta)),nota:"Nombra las áreas que entran y qué hay que instrumentar."};
  if(a)return{estado:"débil",cita:corta(a),nota:"Nombra áreas, pero no dice qué evento hay que capturar para medir."};
  if(inst)return{estado:"débil",cita:corta(mejor(fs,SENAL.instrumenta)),nota:"Habla de medición, pero no dice con quién se construye."};
  if(SENAL.tecnico.test(t))return{estado:"débil",cita:corta(mejor(fs,SENAL.tecnico)),nota:"Menciona una pieza técnica, pero no a las áreas que tienen que entrar."};
  return{estado:"ausente",cita:"",nota:"Todavía no menciona a nadie fuera del squad. En Spin casi nunca es cierto."};
 },
 /* 6. Diferenciación: frente al mercado y frente a lo que ya existe en Spin */
 c6(t,fs){
  const comp=hay(fs,SENAL.competencia), ex=hay(fs,SENAL.existente);
  if(comp&&ex)return{estado:"sustentado",cita:corta(mejor(fs,SENAL.competencia)),nota:"Se compara con el mercado y con lo que Spin ya tiene."};
  if(comp)return{estado:"sustentado",cita:corta(comp),nota:"Dice qué hace la competencia y por qué esto diferencia."};
  if(ex)return{estado:"débil",cita:corta(ex),nota:"Revisa lo que ya existe en Spin, pero no mira al mercado."};
  return{estado:"ausente",cita:"",nota:"Todavía no dice qué hace la competencia ni si ya existe algo parecido en Spin."};
 }
};

function evaluarLocal(txt,otros){
  const fs=frases(txt), avisos=[];
  const en=contar(txt,INGLES), es=contar(txt,ESPANOL);
  if(en>es&&en>4)avisos.push("Tu documento parece estar en inglés. Puedo leerlo, pero mis preguntas y el acta salen en español.");
  const pistas=["problema","usuari","cliente","queremos","quisiera","se me ocurr","podriamos|podríamos","objetivo","m[ée]trica","kpi","fase","lanzar","producto","iniciativa","squad","flujo","pantalla","app\\b","notificaci","tarjeta","soporte","transaccion","problem","target user"]
    .filter(p=>new RegExp(p,"i").test(txt)).length;
  if(pistas<2)avisos.push("Esto no se parece mucho a una iniciativa de producto. Lo reviso igual, pero si te marco casi todo como faltante, seguramente el problema sea el texto y no tu idea.");
  if(otros&&otros.length){
    const cab=txt.slice(0,90).toLowerCase().replace(/\s+/g," ");
    const gem=otros.find(o=>o.prd&&o.prd.slice(0,90).toLowerCase().replace(/\s+/g," ").slice(0,45)===cab.slice(0,45));
    if(gem)avisos.push("Ya evaluaste algo muy parecido: “"+gem.nombre+"”. Si es una versión nueva, guárdala como tal para poder compararlas.");
  }

  const admisibilidad=ELEMENTOS.map(([elemento,nivel,re])=>{
    const f=hay(fs,re);
    const estado=f?(f.length>45?"declarado":"insinuado"):(re.test(txt)?"insinuado":"ausente");
    return{elemento,nivel,estado};
  });

  const minimos=[];
  if(!ELEMENTOS[1][2].test(txt))minimos.push("el problema");
  if(!/usuario|usuaria|cliente|tarjetahabiente|segmento|target user|spinner|persona/i.test(txt))minimos.push("quién lo tiene");
  if(!OBJETIVO.test(txt))minimos.push("el objetivo de negocio");

  const criterios=["c1","c2","c3","c4","c5","c6"].map(id=>{
    const r=EVAL[id](txt,fs);
    return{id,nombre:NOMBRES[id],estado:r.estado,cita:r.cita,nota:r.nota,origen:r.origen};
  });

  const deps=[];
  const cab=txt.slice(0,180).toLowerCase();
  /* el registro manual más todo lo que ya se evaluó en la herramienta */
  const universo=corpusActual().concat(
    (otros||[]).filter(o=>o.iniciativa&&o.criterios)
      .map(o=>({id:o.id,squad:o.squad||"otro squad",nombre:o.iniciativa,objetivo:"",kw:[],evaluada:true}))
      .filter((o,x,a)=>a.findIndex(y=>norm(y.nombre)===norm(o.nombre))===x));
  universo.forEach(i=>{
    if(cab.includes(i.nombre.toLowerCase().slice(0,16)))return;
    const kws=señasDe(i);
    const raices=new Set((txt.match(/[A-Za-zÁÉÍÓÚáéíóúñÑ]{5,}/g)||[]).map(raiz));
    const hits=kws.filter(k=>{
      const r=raiz(k);
      if(r&&raices.has(r))return true;
      try{return new RegExp(k,"i").test(txt);}catch(e){return false;}
    }).length;
    if(hits>=3||(hits===2&&kws.length<=3))deps.push({tipo:"solapamiento",iniciativa:i.nombre,squad:i.squad,evaluada:!!i.evaluada,nota:"Resuelven casi lo mismo. Vale la pena hablarlo antes de construir."});
    else if(hits===2)deps.push({tipo:"dependencia",iniciativa:i.nombre,squad:i.squad,evaluada:!!i.evaluada,nota:"Se tocan en más de un punto. Conviene avisar al squad."});
  });

  return{admisibilidad,minimos,noEvaluable:minimos.length>=2,criterios,avisos,
    dependencias:deps.slice(0,3),
    cobertura:corpusActual().length?"Solo alcanzo a ver las iniciativas que están cargadas. Si hay algo más en marcha, no lo tengo.":"Todavía no hay iniciativas cargadas, así que no puedo decirte si esto choca con lo que hace otro squad."};
}

   .sort((a,b)=>peso(a.estado)-peso(b.estado))
   .slice(0,4).forEach((c,i)=>{

   });

    c=>"En "+c.nombre.toLowerCase()+" me apoyé en una frase tuya. ¿Quién más en Spin firmaría ese número hoy?",
    c=>"Si alguien quisiera matar esta iniciativa en la mesa, ¿por dónde la atacaría?"
  ];
  const sust=criterios.filter(c=>c.estado==="sustentado");
  let k=0;
  while(out.length<3&&k<sust.length&&k<contraste.length){

  out.push({id:"pu",criterio:"cu",origen:"usabilidad",respuesta:"",nolose:false,

function reevaluarLocal(exp){
  const cambios=[];
  const criterios=exp.criterios.map(c=>{
    const p=exp.preguntas.find(q=>q.criterio===c.id);
    if(!p)return c;
    if(p.nolose){
      if(c.estado!=="ausente")return c;
      return{...c,nota:c.nota+" El PM declaró que no lo sabe; queda abierto."};
    }
    const r=(p.respuesta||"").trim();
    if(r.length<25)return c;
    const fsr=frases(r+" ");
    if(!EVAL[c.id])return c;
    const sub=EVAL[c.id](r,fsr.length?fsr:[r]);
    const orden={ausente:0,"débil":1,sustentado:2};
    if(orden[sub.estado]>orden[c.estado]){
      cambios.push({criterio:c.nombre,de:c.estado,a:sub.estado,porque:sub.nota});
      return{...c,estado:sub.estado,cita:corta(r),nota:sub.nota+" Sale de tu respuesta, no del documento."};
    }
    if(orden[sub.estado]===orden[c.estado]&&c.estado!=="sustentado"){
      cambios.push({criterio:c.nombre,de:c.estado,a:c.estado,porque:"Respondiste, pero con lo mismo que ya estaba. "+sub.nota});
    }
    return c;
  });
  return{criterios,cambios};
}

/* ============================================================ CALIFICACIÓN Y PRIORIDAD
   Dos ejes distintos, a propósito:
   1. Solidez (0-100): qué tan sustentado está el PRD. Es lo que el agente sabe medir.
   2. Prioridad estimada (RICE): con los números que el PM declaró, nunca inventados.
   El agente no decide: pone los dos ejes sobre la mesa.
   ============================================================ */

/* Peso de cada criterio. Suma 100. Impacto y evidencia pesan más porque son
   lo que más se repite como vacío en los PRDs revisados de Spin. */
const PESOS={c1:20,c2:20,c3:25,c4:15,c5:10,c6:10};
const VALOR={sustentado:1,"débil":0.5,ausente:0};

function puntajeDe(criterios,admisibilidad){
  let p=0;
  (criterios||[]).forEach(c=>{p+=(PESOS[c.id]||0)*(VALOR[c.estado]||0);});
  /* lo que sube el estándar suma hasta 8 puntos, no resta nunca */
  const mej=(admisibilidad||[]).filter(a=>a.nivel==="mejora"&&a.estado!=="ausente").length;
  return Math.min(100,Math.round(p+mej*2));
}

/* ---- Prioridad estimada, con la lógica RICE de Intercom ----
   (Alcance × Impacto × Confianza) ÷ Esfuerzo.
   El agente NO inventa los números: detecta lo que puede y el PM confirma.
   La confianza sí la pone el agente, porque es justo lo que sabe medir. */
function num(s){return parseFloat(String(s).replace(/\./g,"").replace(",","."));}

function sugerirAlcance(t){
  const m=t.match(/(\d{1,3})\s*%\s*(de\s*)?(los\s*)?(MAU|usuarios activos|usuarios|clientes)/i);
  return m?Math.min(100,num(m[1])):null;
}
function sugerirEsfuerzo(t){
  const fases=(t.match(/fase \d|fase [a-z]\b|etapa \d/gi)||[]).length;
  const areas=new Set((t.match(/\bdata\b|legal|seguridad|riesgos|compliance|operaciones|core\b|proveedor/gi)||[]).map(x=>x.toLowerCase())).size;
  const tec=/no soporta|migraci|motor de reglas|integraci[óo]n con|latencia|deuda t[ée]cnica/i.test(t)?1:0;
  return Math.max(1,Math.min(5,Math.round(fases*0.5+areas*0.6+tec*1.2)||1));
}
function confianzaDe(criterios){
  const ev=(criterios||[]).find(c=>c.id==="c2");
  const e=ev?ev.estado:"ausente";
  if(e==="sustentado")return{valor:80,fuente:"hay análisis con cifra detrás"};
  if(e==="débil")return{valor:50,fuente:"hay una fuente, pero sin cifra ni periodo"};
  return{valor:20,fuente:"no hay evidencia declarada"};
}
/* Escala de impacto, la misma que usa Intercom */
const IMPACTOS=[{v:3,t:"Masivo"},{v:2,t:"Alto"},{v:1,t:"Medio"},{v:0.5,t:"Bajo"},{v:0.25,t:"Mínimo"}];
const ESFUERZOS=[{v:1,t:"Muy bajo"},{v:2,t:"Bajo"},{v:3,t:"Medio"},{v:4,t:"Alto"},{v:5,t:"Muy alto"}];

function prioridadDe(t,criterios){
  return{alcance:sugerirAlcance(t),impacto:null,
         confianza:confianzaDe(criterios),esfuerzo:sugerirEsfuerzo(t),
         sugerido:{alcance:sugerirAlcance(t)!==null,esfuerzo:true}};
}
function riceDe(pr){
  if(!pr||pr.alcance===null||pr.impacto===null)return null;
  const bruto=(pr.alcance*pr.impacto*(pr.confianza.valor/100))/pr.esfuerzo;
  return{bruto:Math.round(bruto*10)/10,indice:Math.max(1,Math.round(bruto))};
}
function faltaRice(pr){
  const f=[];
  if(!pr||pr.alcance===null)f.push("a qué porcentaje de usuarios llega");
  if(!pr||pr.impacto===null)f.push("qué tanto mueve la métrica");
  return f;
}
function bandaPrioridad(r){
  if(!r)return{t:"Falta información",c:"var(--faint)"};
  if(r.indice>=40)return{t:"Alta",c:"#166C43"};
  if(r.indice>=15)return{t:"Media",c:"var(--morado)"};
  return{t:"Baja",c:"var(--naranja)"};
}
/* Cuadrante: solidez contra prioridad. El peligroso es el de abajo a la derecha. */
function cuadranteDe(p,r){
  const alta=r&&r.indice>=15, solida=p>=60;
  if(!r)return{t:"Sin priorizar todavía",d:"Faltan los números para estimar la prioridad. Complétalos abajo."};
  if(solida&&alta)return{t:"Lista para priorizar",d:"Está sustentada y los números la respaldan. Esta es la conversación que la mesa quiere tener."};
  if(!solida&&alta)return{t:"Sustentar antes",d:"Los números prometen, pero la sustentación no acompaña. Es la más peligrosa: se prioriza por entusiasmo."};
  if(solida&&!alta)return{t:"Bien armada, impacto acotado",d:"Está bien construida, pero mueve poco. Pregunta si vale el espacio que ocupa."};
  return{t:"Todavía no",d:"Ni la sustentación ni los números la sostienen. No gastes tiempo de mesa en esto aún."};
}

function vChat(){
  const e=S.exp;
  const msg=(txt,extra)=>`<div class="msg"><div class="av">${ILUS.avatar()}</div><div class="burb">${txt}${extra||""}</div></div>`;

  if(S.fase==="leyendo"||!e.criterios){
    return `<div class="split"><div class="thread">
      ${msg('<h3>Leyendo tu documento</h3><div class="typing"><span></span><span></span><span></span></div><p style="margin-top:10px;color:var(--muted)">Estoy buscando las catorce cosas que un PRD necesita tener, y las frases tuyas en las que me pueda apoyar.</p>')}
    </div>${docHTML()}</div>`;
  }

  if(paso==="preguntas")return vPreguntas(e,msg);

/* ---------- El proceso, siempre visible ---------- */
function stepper(){
  const p=S.exp.paso||"lectura";
  const orden=["lectura","preguntas","informe"];
  const idx=orden.indexOf(p);
  const P=[["lectura","Lectura","Qué tienes y qué falta"],
           ["preguntas","Preguntas","Lo que falta por definir"],
           ["informe","Informe","Calificación y prioridad"]];
  return `<div class="proceso">
    <button class="volver" onclick="ir('exp')">← Tablero</button>
    <div class="pasos3">
      ${P.map(([k,t,d],n)=>{
        const est=n<idx?"hecho":n===idx?"activo":"pendiente";
        const clic=n<=idx?`onclick="irPaso('${k}')"`:"";
        return `${n?'<span class="ln '+(n<=idx?"on":"")+'"></span>':""}
        <button class="p3 ${est}" ${clic} ${n>idx?"disabled":""}>
          <i>${est==="hecho"?"✓":n+1}</i><div><b>${t}</b><span>${d}</span></div></button>`;}).join("")}
    </div>
  </div>`;
}

/* ---------- Momento 1: la lectura ---------- */
function vLectura(e,msg){
  const cuenta=n=>({d:(e.admisibilidad||[]).filter(a=>(a.nivel||"esencial")===n&&a.estado==="declarado").length,
                    i:(e.admisibilidad||[]).filter(a=>(a.nivel||"esencial")===n&&a.estado==="insinuado").length,
                    f:(e.admisibilidad||[]).filter(a=>(a.nivel||"esencial")===n&&a.estado==="ausente").length,
                    t:(e.admisibilidad||[]).filter(a=>(a.nivel||"esencial")===n).length});
  const ce=cuenta("esencial");

  let out="";

  /* 1. la calificación, lo primero */
  out+=`<div class="bloqueA">${veredictoHTML(e,true)}</div>`;

  if((e.avisos||[]).length)
    out+=`<div class="avisos">${e.avisos.map(a=>`<div>${esc(a)}</div>`).join("")}</div>`;

  if(e.noEvaluable){
    out+=`<section class="tarjeta"><h3>Necesito un poco más para poder ayudarte</h3>
      <p class="sub">Con esto no alcanzo a orientarte todavía. Cuéntame al menos:</p>
      <ul class="lista">${e.minimos.map(m=>`<li>${m}</li>`).join("")}</ul></section>`;
    return `${stepper()}<div class="split"><div class="flujo">${out}</div>${docHTML()}</div>`;
  }

  /* 2. inventario del documento, compacto */
  out+=`<section class="tarjeta">
    <div class="th">
      <h3>Qué tiene tu iniciativa hasta ahora</h3>
      <div class="resumen">
        <span class="mini-chip s-declarado">${ce.d} claros</span>
        <span class="mini-chip s-insinuado">${ce.i} a medias</span>
        <span class="mini-chip s-ausente">${ce.f} sin escribir</span>
      </div>
    </div>
    <p class="leyendita">
      <b>Claro</b>: está escrito y con detalle suficiente. ·
      <b>A medias</b>: se menciona de pasada, sin desarrollar. ·
      <b>Sin escribir</b>: no lo encontré en el documento.
    </p>
    <button class="btn link mini" onclick="S.verLista=!S.verLista;render()">
      ${S.verLista?"Ocultar el detalle":"Ver los "+(e.admisibilidad||[]).length+" puntos uno por uno"}</button>
    ${S.verLista?`<div class="cols">
      ${nivelHTML(e,"esencial","Lo que un PRD de Spin tiene que traer","")}
      ${nivelHTML(e,"mejora","Lo que subiría el estándar","No es práctica habitual en Spin todavía. Si falta, lo anoto, pero no baja la calificación.")}
    </div>`:""}
  </section>`;

  /* 3. los seis criterios */
  out+=`<section class="tarjeta">
    <div class="th"><h3>Cómo quedó cada criterio</h3></div>
    <p class="sub">Cada juicio va con la frase tuya en la que me apoyé. Si no encuentro una frase, el criterio no puede quedar sustentado.</p>
    <div class="crits">${e.criterios.map(critHTML).join("")}</div>
  </section>`;

  /* 4. ¿alguien más está en esto? */
  const hayCruce=e.dependencias.length>0;
  const sinDatos=!hayCruce&&corpusActual().length===0&&S.expedientes.filter(x=>x.criterios&&x.id!==e.id).length===0;
  out+=`<section class="similar ${hayCruce?"si":sinDatos?"nd":"no"}">
    <i>${hayCruce?"!":sinDatos?"?":"✓"}</i>
    <div>
      <b>${hayCruce?"Hay alguien más en algo parecido":sinDatos?"Todavía no puedo decirte si alguien más está en esto":"Nadie más está en algo parecido"}</b>
      ${hayCruce?e.dependencias.map(d=>`<p><strong>${esc(d.iniciativa)}</strong> <span class="sq">${d.squad}${d.evaluada?" · ya evaluada":""}</span> — ${esc(d.nota)}</p>`).join("")
        :sinDatos?`<p>No tengo con qué comparar todavía. Carga lo que hace cada squad, o pasa más iniciativas por aquí: cada una que evalúes mejora esta detección.</p>`
                :`<p>Comparé contra todo lo que hay cargado y contra las iniciativas que ya pasaron por aquí. Ninguna resuelve lo mismo.</p>`}
      ${sinDatos?"":`<em>${esc(e.cobertura||"")}</em>`}
      ${corpusActual().length?"":`<button class="btn sec mini" onclick="ir('ini')">Cargar las iniciativas de los squads</button>`}
    </div>
  </section>`;

  /* 5. el paso siguiente */
  const n=(e.preguntas||[]).length;
  out+=`<button class="avanzar" onclick="irPaso('${n?"preguntas":"informe"}')">
    <div><span>Paso 2 de 3</span><b>${n?"Responder las "+n+" preguntas":"Ver el informe"}</b>
    <em>${n?"Son las que te faltan para completar la iniciativa. Toma menos de cinco minutos.":"No tengo preguntas para este documento."}</em></div>
    <i>→</i></button>`;

  return `${stepper()}<div class="split"><div class="flujo">${out}</div>${docHTML()}</div>`;
}

/* ---------- Momento 2: las preguntas ---------- */
function vPreguntas(e,msg){
  const P=e.preguntas||[];
  const i=Math.min(e.qi||0,P.length-1);
  const p=P[i];
  const hechas=P.filter(q=>q.nolose||q.respuesta.trim()).length;
  const listo=hechas===P.length;

  const puntos=P.map((q,x)=>`<button class="pt ${x===i?"on":""} ${q.nolose||q.respuesta.trim()?"ok":""}"
     onclick="S.exp.qi=${x};render()" aria-label="Pregunta ${x+1}"></button>`).join("");

  const vacios=(e.criterios||[]).filter(c=>c.estado!=="sustentado");
  const aus=vacios.filter(c=>c.estado==="ausente").map(c=>c.nombre.toLowerCase());
  const deb=vacios.filter(c=>c.estado==="débil").map(c=>c.nombre.toLowerCase());
  const porque=`<div class="porque">
    <b>Por qué estas preguntas y no otras</b>
    <p>Salen de los vacíos que encontré en tu iniciativa. Primero pregunto por lo que no está escrito,
    después por lo que está a medias.</p>
    <div class="vch">
      ${aus.length?`<span class="vc f"><i></i>Falta: ${aus.join(", ")}</span>`:""}
      ${deb.length?`<span class="vc m"><i></i>A medias: ${deb.join(", ")}</span>`:""}
      ${!aus.length&&!deb.length?`<span class="vc ok"><i></i>No encontré vacíos: estas son de contraste</span>`:""}
    </div>
    <p class="met">Cada pregunta retira uno de los cuatro riesgos de producto —valor, usabilidad, factibilidad
    y viabilidad de negocio—, el marco de Marty Cagan. Debajo de cada una te digo cuál.</p>
  </div>`;

  const cuerpo=porque+`<div class="focoQ">
    <div class="cabQ">
      <span>Pregunta ${i+1} de ${P.length}</span>
      <div class="puntos">${puntos}</div>
    </div>
    <div class="barraP"><i style="width:${hechas/P.length*100}%"></i></div>
    <h2 class="qtxt">${esc(p.texto)}</h2>
    <div class="src">${p.origen==="banco"?"Pregunta fija · criterio de "+NOMBRES[p.criterio].toLowerCase():p.origen==="usabilidad"?"Pregunta fija · riesgo de usabilidad":"Sale de lo que escribiste"} · retira el riesgo de ${RIESGO[p.criterio]||"valor"}</div>
    <textarea rows="5" ${p.nolose?"disabled":""} placeholder="${p.nolose?"Quedó registrado que no lo sabes":"Tu respuesta. Mientras más concreta, más se mueve."}"
      oninput="S.exp.preguntas[${i}].respuesta=this.value;marcarPunto(${i})">${esc(p.respuesta)}</textarea>
    <div class="accQ">
      <button class="btn link" onclick="nolose(${i})">${p.nolose?"Quiero responderla":"No lo sé"}</button>
      <div class="nav">
        ${i>0?`<button class="btn sec" onclick="S.exp.qi=${i-1};render()">Anterior</button>`:""}
        ${i<P.length-1?`<button class="btn" onclick="S.exp.qi=${i+1};render()">Siguiente</button>`:""}
      </div>
    </div>
  </div>
  ${hiloHTML(e,msg)}
  ${cajaPreguntar()}
  <button class="avanzar ${listo?"":"off"}" ${listo?'onclick="revisar()"':"disabled"}>
    <div><span>Paso 3 de 3</span><b>${listo?"Entregar para calificar":"Te faltan "+(P.length-hechas)+" de "+P.length}</b>
    <em>${listo?"Reviso con tus respuestas y te entrego la calificación y el informe.":"Responde todas, o marca las que no sepas. Ninguna se pierde."}</em></div>
    <i>→</i></button>
  <div style="margin-top:10px"><button class="btn link mini" onclick="irPaso('lectura')">← Volver a la lectura</button></div>`;

  return `${stepper()}<div class="split"><div class="thread">${cuerpo}</div>${docHTML()}</div>`;
}

/* ---------- Momento 3: el informe ---------- */
function vInforme(e,msg){
  let hilo="";
  if((e.cambios||[]).length){
    hilo+=msg(`<h3>Qué pasó con lo que me dijiste</h3>
      ${e.cambios.map(c=>`<p><strong>${esc(c.criterio)}</strong>: ${c.de===c.a?"sigue en "+c.a:"de "+c.de+" a "+c.a}. ${esc(c.porque)}</p>`).join("")}`);
  }else if((e.preguntas||[]).length&&!e.ejemplo){
    hilo+=msg(`<h3>Revisé tus respuestas</h3><p>Ningún criterio cambió de estado.</p>`);
  }
  hilo+=`<div class="msg"><div class="av">${ILUS.avatar()}</div><div class="burb" style="padding:0;border:none;background:none;box-shadow:none">${actaHTML(e)}</div></div>`;
  hilo+=hiloHTML(e,msg);
  hilo+=`<div style="margin-top:4px"><button class="btn link" onclick="irPaso('lectura')">← Ver de nuevo la lectura y los criterios</button></div>`;
  return `${stepper()}<div class="split informe"><div class="thread">${hilo}</div>${docHTML()}</div>`;
}

/* ---------- Veredicto con calificación ---------- */

  return `<div class="sem" style="background:linear-gradient(120deg,${n.c}12,${n.c}06)">
    <div class="marcador" style="border-color:${n.c}">
      <b style="color:${n.c}">${e.puntaje}</b><span>de 100</span>
    </div>
    <div><b style="color:${n.c}">${n.t}</b>

    ${grande?`<small>${n.d} Esta calificación mide qué tan sustentado está el documento, no qué tan prioritaria es la iniciativa.</small>`:''}</div>
  </div>`;
}

  return `<div class="ficha">
    <div class="fh">

        </select>
        <em>cuánto mueve la métrica a quien alcanza</em></label>
      <label>Confianza
        <div class="fijo" style="color:var(--morado)">${pr.confianza.valor}%</div>
        <em>${pr.confianza.fuente}</em></label>

function setRice(campo,valor){
  const pr=S.exp.prioridad=S.exp.prioridad||prioridadDe(S.exp.prd,S.exp.criterios);
  if(campo==="alcance")pr.alcance=valor===""?null:Math.max(0,Math.min(100,parseFloat(valor)));
  if(campo==="impacto")pr.impacto=valor===""?null:parseFloat(valor);
  if(campo==="esfuerzo")pr.esfuerzo=parseFloat(valor);
  sincronizar();render();
}

/* ============================================================ MATRIZ Y PODIO */
/* Valor estimado: alcance ponderado por el impacto que declaró el PM.
   Esfuerzo: la escala de 1 a 5 de RICE. Tamaño: confianza. Color: calificación. */
/* Nomenclatura automática: inicial del squad más un número. C1, M2, S3… */
function codigos(){
  const L=ultimasTodas().slice().sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));
  const cont={},m={};
  L.forEach(e=>{
    const sq=(e.squad||"Iniciativa").trim();
    const ini=(sq.replace(/[^A-Za-zÁÉÍÓÚÑ]/g,"")[0]||"I").toUpperCase();
    cont[ini]=(cont[ini]||0)+1;
    m[e.id]=ini+cont[ini];
  });
  return m;
}
function coordenadas(e){
  const pr=e.prioridad;
  /* sin evaluar: se ubica igual, en la zona neutra, y se marca */
  if(!pr||!e.criterios)return{valor:6,esfuerzo:50,conf:20,estimado:true,sinEvaluar:true,r:13};
  /* Si el PM todavía no declaró alcance o impacto, el agente estima con lo que sí sabe
     y lo marca como estimado. Vale más una posición aproximada y avisada que una matriz vacía. */
  let estimado=false;
  let alcance=pr.alcance;
  if(alcance===null){ alcance=sugerirAlcance(e.prd||""); }
  if(alcance===null){ alcance=30; estimado=true; }
  let impacto=pr.impacto;
  if(impacto===null){
    const c3=(e.criterios||[]).find(c=>c.id==="c3");
    impacto=c3&&c3.estado==="sustentado"?2:c3&&c3.estado==="débil"?1:0.5;
    estimado=true;
  }
  const valor=Math.max(3,Math.min(100,Math.round(alcance*impacto/1.5)));
  const esfuerzo=Math.max(4,Math.min(100,Math.round((pr.esfuerzo-0.5)/5*100)));
  const conf=pr.confianza.valor;
  return{valor,esfuerzo,conf,estimado,r:conf>=80?26:conf>=50?20:14};
}

/* ---------- Podio arrastrable ---------- */
function ordenPodio(){
  const L=ultimas();
  const ids=L.map(e=>e.id);
  let p=(S.podio||[]).filter(id=>ids.includes(id));
  ids.forEach(id=>{if(!p.includes(id))p.push(id);});
  if(!S.podio||S.podio.join()!==p.join()){
    if(!S.podio){ /* primera vez: ordena por prioridad estimada */
      p=L.slice().sort((a,b)=>{const x=riceDe(a.prioridad),y=riceDe(b.prioridad);return (y?y.indice:-1)-(x?x.indice:-1);}).map(e=>e.id);
    }
    S.podio=p;
  }
  return S.podio.map(id=>L.find(e=>e.id===id)).filter(Boolean);
}

  return `<section class="podio">

function arrastrar(ev,id){S.arrastrando=id;ev.dataTransfer.effectAllowed="move";}
function soltar(ev,destino){
  ev.preventDefault();
  const o=S.arrastrando; if(!o||o===destino){render();return;}
  const p=S.podio.slice();
  p.splice(p.indexOf(o),1);
  p.splice(p.indexOf(destino),0,o);
  S.podio=p;S.arrastrando=null;persistir();render();
}

function comoDoc(t){
  return (t||"").split(/\n/).map(l=>{
    const s=l.trim();
    if(!s)return "";
    if(/^#{1,3}\s/.test(s))return "<h2>"+esc(s.replace(/^#+\s*/,""))+"</h2>";
    if(/^\d+(\.\d+)?[.)]\s+\S/.test(s)&&s.length<80)return "<h2>"+esc(s)+"</h2>";
    if(/^[A-ZÁÉÍÓÚÑ][^.!?]{2,60}:$/.test(s))return "<h3>"+esc(s)+"</h3>";
    if(/^[-•·*]\s+/.test(s))return "<li>"+esc(s.replace(/^[-•·*]\s+/,""))+"</li>";
    if(/^[A-Za-zÁÉÍÓÚÑ][^:]{2,28}:\s+\S/.test(s)){const i=s.indexOf(":");
      return "<p><strong>"+esc(s.slice(0,i+1))+"</strong> "+esc(s.slice(i+1))+"</p>";}
    return "<p>"+esc(s)+"</p>";
  }).join("").replace(/(<li>.*?<\/li>)+/g,m=>"<ul>"+m+"</ul>");
}

function raiz(w){return w.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"").slice(0,5);}
function kwDe(nombre,objetivo){
  const stop=/^(de|del|la|el|los|las|por|para|con|sin|una|uno|que|y|en|a|al|su|sus)$/i;
  const w=(nombre+" "+(objetivo||"")).split(/[\s,.;()]+/).filter(x=>x.length>4&&!stop.test(x));
  return [...new Set(w.map(raiz))].filter(Boolean).slice(0,6);
}
function señasDe(i){return (i.kw&&i.kw.length)?i.kw:kwDe(i.nombre,i.objetivo);}
function nuevaIniciativa(){
  S.corpus.push({id:"IN-"+(S.corpus.length+1),squad:"",nombre:"",objetivo:"",estado:"En definición",kw:[]});

}
function editarIni(idx,campo,valor){
  const i=S.corpus[idx];if(!i)return;
  i[campo]=valor;
  if(campo==="nombre"||campo==="objetivo")i.kw=kwDe(i.nombre,i.objetivo);
  persistir();
}
function borrarIni(idx){S.corpus.splice(idx,1);persistir();render();}
function exportarCorpus(){
  const b=new Blob([JSON.stringify(S.corpus,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="iniciativas-spin.json";a.click();
}
function importarCorpus(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{
    try{
      const txt=r.result;
      let lista;
      if(f.name.toLowerCase().endsWith(".csv")){
        const fil=txt.split(/\r?\n/).filter(Boolean);
        const cab=fil[0].toLowerCase();
        const desde=/squad|iniciativa|nombre|objetivo/.test(cab)?1:0;
        lista=fil.slice(desde).map((l,n)=>{
          const c=l.split(/[;,\t]/).map(x=>x.trim().replace(/^"|"$/g,""));
          return{id:"IN-"+(n+1),squad:c[0]||"",nombre:c[1]||"",objetivo:c[2]||"",estado:c[3]||"En definición",kw:kwDe(c[1]||"",c[2]||"")};
        });
      }else{
        lista=JSON.parse(txt);
        if(!Array.isArray(lista))throw 0;
        lista=lista.map((i,n)=>({id:i.id||"IN-"+(n+1),squad:i.squad||"",nombre:i.nombre||i.name||"",
          objetivo:i.objetivo||i.objective||"",estado:i.estado||"En definición",kw:i.kw||kwDe(i.nombre||i.name||"",i.objetivo||"")}));
      }
      if(!lista.length)throw 0;
      S.corpus=lista;S.corpusEjemplo=false;persistir();
      set({aviso:"Cargué "+lista.length+" iniciativas. A partir de ahora los cruces se buscan contra estas."});
    }catch(e){set({aviso:"No pude leer ese archivo. Necesito una lista de iniciativas con squad, nombre, objetivo y estado."});}
  };
  r.readAsText(f);
}
